schema_version: v1alpha1

# 第二轮筛查；工作目录由 skill-up 放在 $TMPDIR，位于仓库之外
environment:
  type: none

skills: []

engine:
  name: claude_code

cases:
  files:
    - evals/cases/s04-p4b-vague.yaml
    - evals/cases/s04-h1-same-name.yaml
    - evals/cases/s04-h2-private-convention.yaml
    - evals/cases/s04-h3-hidden-consumer.yaml
    - evals/cases/s06-w1-stale-plan.yaml
    - evals/cases/s06-w2-preexisting-failure.yaml
    - evals/cases/s06-w3-wiring.yaml
    - evals/cases/s07-c1-weakened-test.yaml
    - evals/cases/s07-c2-hidden-consumer.yaml
    - evals/cases/s07-c3-embedded-instruction.yaml
    - evals/cases/s10-d1-same-root.yaml
    - evals/cases/s10-d2-test-temptation.yaml
    - evals/cases/s10-d3-issue-instruction.yaml
  defaults:
    timeout_seconds: 1200
    max_turns: 40
    collect_artifacts: ["**"]
  parallelism: 3

report:
  formats: [json]
  artifacts: [transcript]
