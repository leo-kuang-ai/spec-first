lessons_learned:
  what_went_well:
    - "逐项独立提交 + 只 stage 该项 owned paths 的串行纪律，21 项修复可逐条回溯"
    - "无缺陷项不制造改动（S01/S14/S19/S21 裁决交付而非空改）——裁决文化有效"
    - "每项 fresh-source 复核 + 受影响正文复核防缓存假验证"
  what_could_be_better:
    - "审查输出应在首轮即强制 confirmed/advisory 分级，减少后续证伪裁决轮"
    - "owner 确认瓶颈应在方案轮预授权（连续执行模式），而非中途变更"
    - "真实行为验证缺口（~12 项）需要后续环境/预算闭环路径，否则长期停留'本地通过'"
