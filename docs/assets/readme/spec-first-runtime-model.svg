<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">spec-first runtime model</title>
  <desc id="desc">spec-first 运行模型图：source assets 是唯一真相源，spec-first init 重新生成 Claude Code 和 Codex 的 runtime mirror，宿主入口再产出仓库内 workflow artifacts。</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F7F8"/>
      <stop offset="1" stop-color="#ECEEF1"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F9CF9"/>
      <stop offset="0.5" stop-color="#45B97C"/>
      <stop offset="1" stop-color="#F2A23A"/>
    </linearGradient>
    <filter id="cardShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#162033" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#162033" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A8594"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; letter-spacing:0; }
      .title { fill:#111827; font-size:38px; font-weight:760; text-anchor:middle; }
      .subtitle { fill:#667085; font-size:17px; font-weight:500; text-anchor:middle; }
      .tier { fill:#111827; font-size:22px; font-weight:730; text-anchor:middle; }
      .kicker { fill:#8A94A3; font-size:13px; font-weight:650; text-anchor:middle; }
      .label { fill:#111827; font-size:15px; font-weight:690; text-anchor:middle; }
      .body { fill:#5F6B7A; font-size:13px; font-weight:520; text-anchor:middle; }
      .mono { font-family:"SFMono-Regular", ui-monospace, Menlo, Consolas, monospace; fill:#3F4A58; font-size:12px; font-weight:650; text-anchor:middle; }
      .card { fill:#FFFFFF; stroke:#FFFFFF; stroke-width:1; filter:url(#cardShadow); }
      .pill { fill:#F8FAFC; stroke:#E4E7EC; stroke-width:1; filter:url(#softShadow); }
      .blue { fill:#EEF6FF; stroke:#C8DFFC; stroke-width:1; }
      .green { fill:#EFF8F2; stroke:#CDE9D6; stroke-width:1; }
      .orange { fill:#FFF5E6; stroke:#F7D9A8; stroke-width:1; }
      .purple { fill:#F4F1FF; stroke:#DDD5FE; stroke-width:1; }
      .line { fill:none; stroke:#9AA4B2; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .rule { stroke:#E4E7EC; stroke-width:1; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#page)"/>
  <circle cx="180" cy="132" r="126" fill="#FFFFFF" opacity="0.68"/>
  <circle cx="1056" cy="538" r="156" fill="#FFFFFF" opacity="0.54"/>

  <text x="600" y="58" class="title">一个 source set，投影到多个宿主</text>
  <text x="600" y="90" class="subtitle">只改 source；runtime mirror 可丢弃、可重建；workflow artifacts 留在目标仓库</text>

  <g transform="translate(122 116)">
    <rect class="card" x="0" y="0" width="956" height="116" rx="30"/>
    <text x="478" y="38" class="kicker">Layer 1</text>
    <text x="478" y="70" class="tier">Source assets · 唯一真相源</text>
    <line class="rule" x1="54" y1="84" x2="902" y2="84"/>
    <g transform="translate(82 98)">
      <rect class="blue" x="0" y="-18" width="122" height="36" rx="18"/>
      <text x="61" y="5" class="mono">skills/</text>
    </g>
    <g transform="translate(234 98)">
      <rect class="blue" x="0" y="-18" width="122" height="36" rx="18"/>
      <text x="61" y="5" class="mono">agents/</text>
    </g>
    <g transform="translate(386 98)">
      <rect class="blue" x="0" y="-18" width="140" height="36" rx="18"/>
      <text x="70" y="5" class="mono">templates/</text>
    </g>
    <g transform="translate(556 98)">
      <rect class="blue" x="0" y="-18" width="122" height="36" rx="18"/>
      <text x="61" y="5" class="mono">src/cli/</text>
    </g>
    <g transform="translate(708 98)">
      <rect class="blue" x="0" y="-18" width="166" height="36" rx="18"/>
      <text x="83" y="5" class="mono">README / docs</text>
    </g>
  </g>

  <path class="line" d="M 600 238 V 286"/>
  <g transform="translate(462 250)">
    <rect x="0" y="0" width="276" height="44" rx="22" fill="#FFFFFF" stroke="#E4E7EC" filter="url(#softShadow)"/>
    <rect x="18" y="31" width="240" height="5" rx="2.5" fill="url(#bar)"/>
    <text x="138" y="23" class="mono">spec-first init 重新生成</text>
  </g>

  <g transform="translate(122 294)">
    <rect class="card" x="0" y="0" width="956" height="126" rx="30"/>
    <text x="478" y="38" class="kicker">Layer 2</text>
    <text x="478" y="70" class="tier">Generated runtime mirror · 不手改</text>
    <g transform="translate(78 84)">
      <rect class="purple" x="0" y="0" width="240" height="42" rx="21"/>
      <text x="120" y="26" class="mono">Claude Code /spec:*</text>
    </g>
    <g transform="translate(358 84)">
      <rect class="purple" x="0" y="0" width="240" height="42" rx="21"/>
      <text x="120" y="26" class="mono">Codex $spec-*</text>
    </g>
    <g transform="translate(638 84)">
      <rect class="purple" x="0" y="0" width="240" height="42" rx="21"/>
      <text x="120" y="26" class="mono">.claude / .codex / .agents</text>
    </g>
  </g>

  <path class="line" d="M 600 426 V 484"/>
  <g transform="translate(472 442)">
    <rect x="0" y="0" width="256" height="40" rx="20" fill="#FFFFFF" stroke="#E4E7EC" filter="url(#softShadow)"/>
    <text x="128" y="25" class="mono">宿主入口执行 workflow</text>
  </g>

  <g transform="translate(122 492)">
    <rect class="card" x="0" y="0" width="956" height="132" rx="30"/>
    <text x="478" y="38" class="kicker">Layer 3</text>
    <text x="478" y="70" class="tier">Workflow artifacts · 留在目标仓库</text>
    <text x="478" y="96" class="body">需求、计划、任务、工作证据、审查、调试和知识沉淀</text>
    <g transform="translate(312 112)">
      <rect class="green" x="0" y="-17" width="332" height="34" rx="17"/>
      <text x="166" y="5" class="mono">plans → tasks → work/review/debug → learnings</text>
    </g>
  </g>
</svg>
