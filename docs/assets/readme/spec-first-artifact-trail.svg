<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">spec-first artifact trail</title>
  <desc id="desc">spec-first 产物链路图：团队共享文档位于 docs/brainstorms、docs/plans、docs/tasks、review/debug notes 和 docs/solutions，本地验证证据位于 .spec-first/workflows。</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F7F8"/>
      <stop offset="1" stop-color="#ECEEF1"/>
    </linearGradient>
    <filter id="cardShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#162033" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#162033" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A8594"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; letter-spacing:0; }
      .title { fill:#111827; font-size:38px; font-weight:760; text-anchor:middle; }
      .subtitle { fill:#667085; font-size:17px; font-weight:500; text-anchor:middle; }
      .section { fill:#111827; font-size:22px; font-weight:730; text-anchor:middle; }
      .kicker { fill:#8A94A3; font-size:13px; font-weight:650; text-anchor:middle; }
      .label { fill:#111827; font-size:15px; font-weight:690; text-anchor:middle; }
      .body { fill:#5F6B7A; font-size:13px; font-weight:520; text-anchor:middle; }
      .mono { font-family:"SFMono-Regular", ui-monospace, Menlo, Consolas, monospace; fill:#3F4A58; font-size:12px; font-weight:650; text-anchor:middle; }
      .card { fill:#FFFFFF; stroke:#FFFFFF; stroke-width:1; filter:url(#cardShadow); }
      .tile { fill:#F8FAFC; stroke:#E4E7EC; stroke-width:1; filter:url(#softShadow); }
      .blue { fill:#EEF6FF; stroke:#C8DFFC; stroke-width:1; }
      .green { fill:#EFF8F2; stroke:#CDE9D6; stroke-width:1; }
      .orange { fill:#FFF5E6; stroke:#F7D9A8; stroke-width:1; }
      .purple { fill:#F4F1FF; stroke:#DDD5FE; stroke-width:1; }
      .line { fill:none; stroke:#A8B1BD; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .dash { fill:none; stroke:#C0C7D0; stroke-width:1.5; stroke-dasharray:6 7; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#page)"/>
  <circle cx="134" cy="158" r="122" fill="#FFFFFF" opacity="0.68"/>
  <circle cx="1070" cy="516" r="162" fill="#FFFFFF" opacity="0.54"/>

  <text x="600" y="66" class="title">留下能被下一次工作继续使用的材料</text>
  <text x="600" y="99" class="subtitle">文档用于团队共享，本地 evidence 用于验证和恢复，不混在隐藏会话状态里</text>

  <g transform="translate(72 198)">
    <rect class="card" x="0" y="0" width="248" height="246" rx="30"/>
    <text x="124" y="48" class="kicker">来自会话</text>
    <text x="124" y="84" class="section">问题或目标</text>
    <rect class="orange" x="34" y="122" width="180" height="34" rx="17"/>
    <text x="124" y="144" class="body">需求 · Bug · Review</text>
    <rect class="blue" x="50" y="170" width="148" height="34" rx="17"/>
    <text x="124" y="192" class="label">约束与证据</text>
  </g>

  <path class="line" d="M 320 322 C 358 306 394 306 430 322"/>

  <g transform="translate(430 144)">
    <rect class="card" x="0" y="0" width="330" height="398" rx="32"/>
    <text x="165" y="48" class="kicker">团队共享</text>
    <text x="165" y="82" class="section">Docs artifacts</text>
    <text x="165" y="110" class="body">commit 后可审查、可引用、可交接</text>

    <g transform="translate(38 148)">
      <rect class="tile" x="0" y="0" width="254" height="48" rx="16"/>
      <circle cx="28" cy="24" r="8" fill="#4F9CF9"/>
      <text x="152" y="29" class="mono">docs/brainstorms/</text>
    </g>
    <g transform="translate(38 208)">
      <rect class="tile" x="0" y="0" width="254" height="48" rx="16"/>
      <circle cx="28" cy="24" r="8" fill="#4F9CF9"/>
      <text x="152" y="29" class="mono">docs/plans/</text>
    </g>
    <g transform="translate(38 268)">
      <rect class="tile" x="0" y="0" width="254" height="48" rx="16"/>
      <circle cx="28" cy="24" r="8" fill="#45B97C"/>
      <text x="152" y="29" class="mono">docs/tasks/</text>
    </g>
    <g transform="translate(38 328)">
      <rect class="tile" x="0" y="0" width="254" height="48" rx="16"/>
      <circle cx="28" cy="24" r="8" fill="#45B97C"/>
      <text x="152" y="29" class="mono">docs/solutions/</text>
    </g>
  </g>

  <path class="dash" d="M 760 270 H 840"/>
  <path class="dash" d="M 760 394 H 840"/>

  <g transform="translate(840 144)">
    <rect class="card" x="0" y="0" width="288" height="398" rx="32"/>
    <text x="144" y="48" class="kicker">本地验证</text>
    <text x="144" y="82" class="section">Runtime evidence</text>
    <text x="144" y="110" class="body">默认留在 repo-local runtime 区域</text>

    <g transform="translate(36 154)">
      <rect class="purple" x="0" y="0" width="216" height="74" rx="20" filter="url(#softShadow)"/>
      <text x="108" y="31" class="mono">.spec-first/workflows/</text>
      <text x="108" y="53" class="body">closeout · verification</text>
    </g>
    <g transform="translate(36 252)">
      <rect class="green" x="0" y="0" width="216" height="74" rx="20" filter="url(#softShadow)"/>
      <text x="108" y="31" class="mono">review · debug notes</text>
      <text x="108" y="53" class="body">findings · root cause</text>
    </g>
    <g transform="translate(36 346)">
      <rect class="blue" x="0" y="0" width="216" height="32" rx="16"/>
      <text x="108" y="21" class="label">不依赖隐藏 memory</text>
    </g>
  </g>

  <g transform="translate(252 586)">
    <rect x="0" y="0" width="696" height="48" rx="24" fill="#FFFFFF" opacity="0.88" stroke="#E4E7EC"/>
    <text x="348" y="30" class="mono">shared docs for people · local evidence for gates · both remain inspectable</text>
  </g>
</svg>
