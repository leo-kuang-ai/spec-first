<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">spec-first CLI workflow demo</title>
  <desc id="desc">模拟从安装 spec-first、init 初始化、runtime-setup 准备运行时，到执行 ideate、brainstorm、prd、doc-review、plan、write-tasks、work、code-review、compound 研发 workflow；debug 作为失败或根因不明时的旁路循环，并在仓库中留下带文件名的 docs artifacts。</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F8FA"/>
      <stop offset="1" stop-color="#ECEFF3"/>
    </linearGradient>
    <linearGradient id="terminalTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#111827" flood-opacity="0.18"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; letter-spacing:0; }
      .title { fill:#111827; font-size:34px; font-weight:760; text-anchor:middle; }
      .subtitle { fill:#667085; font-size:16px; font-weight:520; text-anchor:middle; }
      .mono { font-family:"SFMono-Regular", ui-monospace, Menlo, Consolas, monospace; font-size:13.5px; font-weight:620; }
      .mono-small { font-family:"SFMono-Regular", ui-monospace, Menlo, Consolas, monospace; font-size:11.5px; font-weight:600; }
      .cmd { fill:#E5E7EB; }
      .ok { fill:#7EE2A8; }
      .muted { fill:#9CA3AF; }
      .path { fill:#93C5FD; }
      .accent { fill:#FBBF24; }
      .artifact-file { fill:#64748B; }
      .artifact-file-small { fill:#64748B; font-size:10.5px; font-weight:600; }
      .panel-title { fill:#111827; font-size:18px; font-weight:720; }
      .panel-copy { fill:#667085; font-size:13px; font-weight:540; }
      .chip-text { fill:#344054; font-size:12px; font-weight:680; text-anchor:middle; }
      .scan { animation: scan 16s ease-in-out infinite; }
      .progressBar { transform-origin:0 0; animation: grow 16s ease-in-out infinite; }
      .artifact1 { animation: artifactPulse 16s ease-in-out infinite; animation-delay:3.8s; }
      .artifact2 { animation: artifactPulse 16s ease-in-out infinite; animation-delay:5.2s; }
      .artifact3 { animation: artifactPulse 16s ease-in-out infinite; animation-delay:8.0s; }
      .artifact4 { animation: artifactPulse 16s ease-in-out infinite; animation-delay:9.2s; }
      .artifact5 { animation: artifactPulse 16s ease-in-out infinite; animation-delay:11.0s; }
      .artifact6 { animation: artifactPulse 16s ease-in-out infinite; animation-delay:12.4s; }
      .artifact7 { animation: artifactPulse 16s ease-in-out infinite; animation-delay:14.0s; }
      .cursor { animation: blink 1s steps(2, start) infinite; }
      @keyframes scan {
        0% { transform:translateY(0); opacity:0.95; }
        9% { transform:translateY(34px); opacity:0.95; }
        18% { transform:translateY(68px); opacity:0.95; }
        27% { transform:translateY(102px); opacity:0.95; }
        36% { transform:translateY(136px); opacity:0.95; }
        45% { transform:translateY(170px); opacity:0.95; }
        54% { transform:translateY(204px); opacity:0.95; }
        63% { transform:translateY(238px); opacity:0.95; }
        72% { transform:translateY(272px); opacity:0.95; }
        82% { transform:translateY(306px); opacity:0.95; }
        92% { transform:translateY(340px); opacity:0.95; }
        100% { transform:translateY(374px); opacity:0.95; }
      }
      @keyframes grow {
        0% { transform:scaleX(0.08); }
        18% { transform:scaleX(0.22); }
        36% { transform:scaleX(0.42); }
        54% { transform:scaleX(0.58); }
        72% { transform:scaleX(0.76); }
        92%, 100% { transform:scaleX(1); }
      }
      @keyframes artifactPulse {
        0%, 12% { transform:translateX(6px); }
        18%, 100% { transform:translateX(0); }
      }
      @keyframes blink {
        0%, 45% { opacity:1; }
        46%, 100% { opacity:0; }
      }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#page)"/>
  <circle cx="170" cy="150" r="118" fill="#FFFFFF" opacity="0.72"/>
  <circle cx="1040" cy="560" r="158" fill="#FFFFFF" opacity="0.54"/>

  <text x="600" y="58" class="title">跑完一圈可检查的研发闭环</text>
  <text x="600" y="88" class="subtitle">init → runtime-setup → ideate → brainstorm → PRD → doc-review → plan → write-tasks → work → review → compound</text>

  <g transform="translate(64 122)" filter="url(#shadow)">
    <rect x="0" y="0" width="742" height="520" rx="22" fill="#0B1020"/>
    <rect x="0" y="0" width="742" height="44" rx="22" fill="url(#terminalTop)"/>
    <rect x="0" y="28" width="742" height="24" fill="#111827"/>
    <circle cx="28" cy="22" r="6" fill="#F87171"/>
    <circle cx="50" cy="22" r="6" fill="#FBBF24"/>
    <circle cx="72" cy="22" r="6" fill="#34D399"/>
    <text x="102" y="28" class="mono-small muted">spec-first simulated workflow</text>

    <g transform="translate(30 66)">
      <rect class="scan" x="-12" y="-17" width="692" height="28" rx="8" fill="#1D4ED8" opacity="0.28"/>

      <text x="0" y="0" class="mono cmd">$ npm install -g spec-first</text>
      <text x="430" y="0" class="mono-small ok">✓ installed</text>

      <text x="0" y="34" class="mono cmd">$ spec-first init</text>
      <text x="430" y="34" class="mono-small ok">✓ runtime  ✓ .gitignore</text>

      <text x="0" y="68" class="mono cmd">spec-runtime-setup</text>
      <text x="430" y="68" class="mono-small ok">✓ MCP/helper readiness</text>

      <text x="0" y="102" class="mono cmd">spec-ideate "新用户 onboarding"</text>
      <text x="430" y="102" class="mono-small ok">✓ ranked ideas</text>

      <text x="0" y="136" class="mono cmd">spec-brainstorm "改进 onboarding"</text>
      <text x="430" y="136" class="mono-small ok">✓ docs/plans/</text>

      <text x="0" y="170" class="mono cmd">spec-prd docs/brainstorms/...md</text>
      <text x="430" y="170" class="mono-small ok">✓ PRD-ready requirements</text>

      <text x="0" y="204" class="mono cmd">spec-doc-review docs/brainstorms/...md</text>
      <text x="430" y="204" class="mono-small ok">✓ gaps reviewed</text>

      <text x="0" y="238" class="mono cmd">spec-plan docs/brainstorms/...md</text>
      <text x="430" y="238" class="mono-small ok">✓ docs/plans/</text>

      <text x="0" y="272" class="mono cmd">spec-write-tasks docs/plans/...md</text>
      <text x="430" y="272" class="mono-small ok">✓ docs/tasks/</text>

      <text x="0" y="306" class="mono cmd">spec-work docs/tasks/...md</text>
      <text x="430" y="306" class="mono-small ok">✓ source changes  ✓ checks</text>

      <text x="0" y="340" class="mono cmd">spec-code-review</text>
      <text x="430" y="340" class="mono-small ok">✓ findings resolved</text>
      <text x="0" y="374" class="mono cmd">spec-debug  # failure path</text>
      <text x="430" y="374" class="mono-small ok">↺ debug loop</text>
      <text x="0" y="408" class="mono cmd">spec-compound</text>
      <text x="430" y="408" class="mono-small ok">✓ docs/solutions/<tspan class="cursor accent"> █</tspan></text>
    </g>
  </g>

  <g transform="translate(842 122)">
    <rect x="0" y="0" width="292" height="132" rx="18" fill="#FFFFFF" stroke="#E4E7EC"/>
    <text x="24" y="34" class="panel-title">研发流程进度</text>
    <text x="24" y="60" class="panel-copy">setup、定义、计划、实现、审查、沉淀</text>
    <rect x="24" y="86" width="244" height="12" rx="6" fill="#EAECF0"/>
    <rect class="progressBar" x="24" y="86" width="244" height="12" rx="6" fill="#22C55E"/>
    <g transform="translate(24 112)">
      <rect x="0" y="0" width="50" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="25" y="17" class="chip-text">setup</text>
      <rect x="56" y="0" width="42" height="26" rx="13" fill="#F0FDF4" stroke="#BBF7D0"/>
      <text x="77" y="17" class="chip-text">spec</text>
      <rect x="104" y="0" width="42" height="26" rx="13" fill="#FFFBEB" stroke="#FDE68A"/>
      <text x="125" y="17" class="chip-text">plan</text>
      <rect x="152" y="0" width="44" height="26" rx="13" fill="#F5F3FF" stroke="#DDD6FE"/>
      <text x="174" y="17" class="chip-text">work</text>
      <rect x="202" y="0" width="42" height="26" rx="13" fill="#ECFDF3" stroke="#A7F3D0"/>
      <text x="223" y="17" class="chip-text">learn</text>
    </g>
  </g>

  <g transform="translate(842 292)">
    <rect x="0" y="0" width="292" height="350" rx="18" fill="#FFFFFF" stroke="#E4E7EC"/>
    <text x="24" y="36" class="panel-title">仓库留下的证据</text>
    <text x="24" y="62" class="panel-copy">不是隐藏记忆，而是可检查文件</text>

    <g transform="translate(24 82)">
      <text x="0" y="0" class="mono-small muted">docs/</text>
      <g class="artifact1">
        <text x="18" y="26" class="mono-small path">ideation/</text>
        <text x="38" y="41" class="mono-small artifact-file-small">ideas.md</text>
      </g>
      <g class="artifact2">
        <text x="18" y="60" class="mono-small path">brainstorms/</text>
        <text x="38" y="75" class="mono-small artifact-file-small">onboarding-requirements.md</text>
      </g>
      <g class="artifact3">
        <text x="18" y="94" class="mono-small path">plans/</text>
        <text x="38" y="109" class="mono-small artifact-file-small">onboarding-plan.md</text>
      </g>
      <g class="artifact4">
        <text x="18" y="128" class="mono-small path">tasks/</text>
        <text x="38" y="143" class="mono-small artifact-file-small">task-pack.md</text>
      </g>
      <g class="artifact5">
        <text x="18" y="162" class="mono-small path">solutions/</text>
        <text x="38" y="177" class="mono-small artifact-file-small">learning.md</text>
      </g>
      <g class="artifact6">
        <text x="0" y="196" class="mono-small muted">.spec-first/</text>
        <text x="18" y="214" class="mono-small path">workflows/</text>
        <text x="38" y="230" class="mono-small artifact-file">verification-run-summary.json</text>
      </g>
    </g>
  </g>
</svg>
