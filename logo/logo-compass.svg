<svg width="232" height="60" viewBox="0 0 232 60" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="spec-first">
  <defs>
    <clipPath id="c-clip">
      <rect x="0" y="6" width="48" height="48" rx="10"/>
    </clipPath>
  </defs>

  <!-- Mark: deep navy -->
  <rect x="0" y="6" width="48" height="48" rx="10" fill="#1e1b4b"/>

  <g clip-path="url(#c-clip)">

    <!-- Arc — the spec being drawn (rendered behind compass) -->
    <path d="M 6,44 Q 24,56 42,44"
      fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Left leg: pencil side (slightly thicker — pencil body) -->
    <line x1="24" y1="12" x2="10" y2="42"
      stroke="#e0e7ff" stroke-width="3" stroke-linecap="butt"/>

    <!-- Pencil tip: angled flat cut -->
    <polygon points="8,42 12,42 10,50" fill="#a5b4fc"/>

    <!-- Right leg: needle side (thinner — metal pin) -->
    <line x1="24" y1="12" x2="38" y2="42"
      stroke="#e0e7ff" stroke-width="2.5" stroke-linecap="butt"/>

    <!-- Needle tip: sharp spike -->
    <polygon points="37,42 39,42 38,53" fill="#c7d2fe"/>

    <!-- Pivot hinge: outer ring + center hole -->
    <circle cx="24" cy="12" r="5" fill="#c7d2fe"/>
    <circle cx="24" cy="12" r="2" fill="#1e1b4b"/>

  </g>

  <!-- Wordmark -->
  <text x="62" y="39"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="26" letter-spacing="-0.5">
    <tspan fill="#1e1b4b" font-weight="700">spec</tspan><tspan fill="#6366f1" font-weight="400">-first</tspan>
  </text>
</svg>
