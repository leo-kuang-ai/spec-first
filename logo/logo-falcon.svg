<svg width="232" height="60" viewBox="0 0 232 60" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="spec-first — falcon">
  <defs>
    <clipPath id="f-clip">
      <rect x="0" y="6" width="48" height="48" rx="10"/>
    </clipPath>
  </defs>

  <!-- Mark: dark slate -->
  <rect x="0" y="6" width="48" height="48" rx="10" fill="#1e293b"/>

  <!-- Bird (clipped) -->
  <g clip-path="url(#f-clip)" fill="#f1f5f9">
    <!-- Body: compact, more angled than raven -->
    <ellipse cx="18" cy="33" rx="10" ry="7" transform="rotate(-20 18 33)"/>
    <!-- Head: smaller, tighter -->
    <circle cx="29" cy="17" r="7"/>
    <!-- Beak: sharp and small -->
    <polygon points="36,14 43,17 36,19"/>
    <!-- Tail: narrow, pointed -->
    <polygon points="8,37 4,50 15,43"/>
    <!-- Folded wing tip hint -->
    <polygon points="14,27 8,23 20,25" opacity="0.6"/>
  </g>

  <!-- Eye -->
  <circle cx="30" cy="15" r="1.8" fill="#1e293b"/>
  <!-- Malar stripe — the signature falcon cheek mark -->
  <rect x="23" y="19" width="7" height="2.5" rx="1.25" fill="#1e293b" transform="rotate(-8 23 19)"/>

  <!-- Wordmark -->
  <text x="62" y="39"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="26" letter-spacing="-0.5">
    <tspan fill="#1e1b4b" font-weight="700">spec</tspan><tspan fill="#6366f1" font-weight="400">-first</tspan>
  </text>
</svg>
