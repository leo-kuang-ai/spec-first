<svg width="232" height="60" viewBox="0 0 232 60" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="spec-first">
  <defs>
    <clipPath id="bw-clip">
      <rect x="0" y="6" width="48" height="48" rx="10"/>
    </clipPath>
  </defs>

  <!-- ── Mark: deep indigo ── -->
  <rect x="0" y="6" width="48" height="48" rx="10" fill="#3730a3"/>

  <g clip-path="url(#bw-clip)">

    <!-- ── Bower arch (the spec structure) ── -->
    <!-- Two posts + curved arch top -->
    <path d="M 9,54 L 9,43 C 9,25 39,25 39,43 L 39,54"
      fill="none" stroke="#818cf8" stroke-width="3.5"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Blue decorative objects collected at bower entrance -->
    <!-- (bowerbirds obsessively gather blue objects — their "spec artifacts") -->
    <circle cx="16" cy="50" r="2.2" fill="#6366f1"/>
    <circle cx="24" cy="51.5" r="2.5" fill="#6366f1"/>
    <circle cx="32" cy="50" r="2.2" fill="#6366f1"/>

    <!-- ── Bird (perched at arch peak, facing right) ── -->

    <!-- Legs: thin lines connecting body to arch -->
    <line x1="20" y1="40" x2="17" y2="44" stroke="#c7d2fe" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="23" y1="40" x2="25" y2="44" stroke="#c7d2fe" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Body: plump, rounded (bowerbird is a chunky bird) -->
    <ellipse cx="21" cy="34" rx="9" ry="6" fill="#f0f4ff" transform="rotate(-10 21 34)"/>

    <!-- Head: round -->
    <circle cx="28" cy="25" r="8" fill="#f0f4ff"/>

    <!-- Beak: modest, pointing right (not a raptor beak) -->
    <polygon points="35,23 43,25 35,27" fill="#f0f4ff"/>

    <!-- Eye: punched out with bg color -->
    <circle cx="30" cy="23" r="2.1" fill="#3730a3"/>

  </g>

  <!-- ── Wordmark ── -->
  <text x="62" y="39"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="26" letter-spacing="-0.5">
    <tspan fill="#1e1b4b" font-weight="700">spec</tspan><tspan fill="#6366f1" font-weight="400">-first</tspan>
  </text>
</svg>
