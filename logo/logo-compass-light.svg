<svg width="232" height="60" viewBox="0 0 232 60" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="spec-first">
  <defs>
    <clipPath id="cl-clip">
      <rect x="0" y="6" width="48" height="48" rx="10"/>
    </clipPath>
  </defs>

  <!-- Mark: clean white -->
  <rect x="0" y="6" width="48" height="48" rx="10" fill="#f8fafc"/>
  <rect x="0" y="6" width="48" height="48" rx="10" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <g clip-path="url(#cl-clip)">

    <!-- Arc: the drawn spec -->
    <path d="M 6,44 Q 24,56 42,44"
      fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Left leg (pencil) -->
    <line x1="24" y1="12" x2="10" y2="42" stroke="#1e1b4b" stroke-width="3" stroke-linecap="butt"/>
    <polygon points="8,42 12,42 10,50" fill="#4338ca"/>

    <!-- Right leg (needle) -->
    <line x1="24" y1="12" x2="38" y2="42" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="butt"/>
    <polygon points="37,42 39,42 38,53" fill="#334155"/>

    <!-- Pivot -->
    <circle cx="24" cy="12" r="5" fill="#312e81"/>
    <circle cx="24" cy="12" r="2" fill="#f8fafc"/>

  </g>

  <!-- Wordmark -->
  <text x="62" y="39"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="26" letter-spacing="-0.5">
    <tspan fill="#1e1b4b" font-weight="700">spec</tspan><tspan fill="#6366f1" font-weight="400">-first</tspan>
  </text>
</svg>
