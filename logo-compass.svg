<svg width="232" height="60" viewBox="0 0 232 60" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="spec-first">
  <defs>
    <clipPath id="c-clip">
      <rect x="0" y="6" width="48" height="48" rx="10"/>
    </clipPath>

    <!-- Arc gradient: needle side (dim/deep) → pencil tip (bright/active) -->
    <linearGradient id="arc-grad" x1="42" y1="44" x2="6" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#4338ca" stop-opacity="0.45"/>
      <stop offset="55%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Glow for the active pencil tip -->
    <radialGradient id="tip-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c4b5fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Mark background: deep space navy -->
  <rect x="0" y="6" width="48" height="48" rx="10" fill="#0f172a"/>

  <g clip-path="url(#c-clip)">

    <!-- ── Intelligence signals: concentric rings at pivot ── -->
    <!-- Suggests a signal / neural broadcast from the reasoning center -->
    <circle cx="24" cy="12" r="9"  fill="none" stroke="#4338ca" stroke-width="0.75" opacity="0.5"/>
    <circle cx="24" cy="12" r="14" fill="none" stroke="#312e81" stroke-width="0.5"  opacity="0.3"/>

    <!-- ── Arc: the spec being drawn by AI ── -->
    <!-- Gradient from dim (needle/start) → bright violet (pencil/active) -->
    <path d="M 6,44 Q 24,56 42,44"
      fill="none" stroke="url(#arc-grad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- ── Reasoning nodes along the arc (chain-of-thought waypoints) ── -->
    <!-- Positions calculated along quadratic bezier M6,44 Q24,56 42,44 -->
    <!-- t=0.75 → (33, 48.5): near needle, dim -->
    <circle cx="33" cy="49" r="1.5" fill="#6366f1" opacity="0.55"/>
    <!-- t=0.5  → (24, 50): midpoint -->
    <circle cx="24" cy="50" r="2"   fill="#818cf8" opacity="0.8"/>
    <!-- t=0.25 → (15, 48.5): near pencil, bright -->
    <circle cx="15" cy="49" r="1.5" fill="#a78bfa"/>

    <!-- ── Compass legs ── -->
    <!-- Left leg: pencil side (thicker body) -->
    <line x1="24" y1="12" x2="10" y2="42" stroke="#e0e7ff" stroke-width="3"   stroke-linecap="butt"/>
    <!-- Right leg: needle side (slimmer metal) -->
    <line x1="24" y1="12" x2="38" y2="42" stroke="#e0e7ff" stroke-width="2.5" stroke-linecap="butt"/>

    <!-- Pencil tip triangle -->
    <polygon points="8,42 12,42 10,50" fill="#a5b4fc"/>
    <!-- Needle tip: sharp spike -->
    <polygon points="37,42 39,42 38,53" fill="#c7d2fe"/>

    <!-- ── Pivot hinge ── -->
    <circle cx="24" cy="12" r="5"   fill="#c7d2fe"/>
    <circle cx="24" cy="12" r="2"   fill="#0f172a"/>

    <!-- ── Active glow at pencil tip (AI writing the spec) ── -->
    <circle cx="10" cy="50" r="5" fill="url(#tip-glow)"/>
    <!-- Spark rays radiating from tip -->
    <line x1="10" y1="50" x2="6"  y2="47" stroke="#c4b5fd" stroke-width="1"   stroke-linecap="round" opacity="0.85"/>
    <line x1="10" y1="50" x2="5"  y2="50" stroke="#c4b5fd" stroke-width="0.75" stroke-linecap="round" opacity="0.65"/>
    <line x1="10" y1="50" x2="6"  y2="53" stroke="#c4b5fd" stroke-width="1"   stroke-linecap="round" opacity="0.5"/>

  </g>

  <!-- ── Wordmark ── -->
  <text x="62" y="39"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="26" letter-spacing="-0.5">
    <tspan fill="#1e1b4b" font-weight="700">spec</tspan><tspan fill="#6366f1" font-weight="400">-first</tspan>
  </text>
</svg>
