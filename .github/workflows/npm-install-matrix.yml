name: npm Install Matrix

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-tarball:
    name: npm-install-${{ matrix.os }}-node-${{ matrix.node }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack, install and execute the tarball
        env:
          SPEC_FIRST_SMOKE_ARTIFACT_DIR: .spec-first/ci/npm-install-matrix/${{ runner.os }}-node-${{ matrix.node }}
        run: node scripts/npm-install-matrix-smoke.cjs

      - name: Upload install smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-install-matrix-${{ runner.os }}-node-${{ matrix.node }}
          path: .spec-first/ci/npm-install-matrix/
          if-no-files-found: ignore
          retention-days: 7
