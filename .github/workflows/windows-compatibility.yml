name: Windows Compatibility

on:
  push:
    paths:
      - '.github/workflows/windows-compatibility.yml'
      - 'bin/**'
      - 'src/**'
      - 'scripts/**'
      - 'skills/**'
      - 'templates/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/windows-compatibility.yml'
      - 'bin/**'
      - 'src/**'
      - 'scripts/**'
      - 'skills/**'
      - 'templates/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: windows-latest / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture legacy Windows replay
        shell: pwsh
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'mcp-setup-legacy-windows-node-${{ matrix.node }}.json'
          $output = & node tests/fixtures/mcp-setup/legacy-parity/replay-runtime-contracts.cjs --platform windows --source a574194b13ee3e53e1d7cd36bbfc86ac058db0cc
          $status = $LASTEXITCODE
          $output | Set-Content -LiteralPath $artifact -Encoding utf8
          $output
          if ($status -ne 0) { exit $status }

      - name: Upload legacy Windows replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-setup-legacy-windows-node-${{ matrix.node }}
          path: ${{ runner.temp }}/mcp-setup-legacy-windows-node-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck
        run: npm run typecheck

      - name: MCP setup Node 契约
        run: npm run test:mcp-setup

      - name: Test
        run: npm test

      - name: Validate package contents
        run: npm run build

      - name: Pack and install globally
        shell: pwsh
        run: |
          $packJson = npm pack --json | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pack = $packJson | ConvertFrom-Json
          $tarball = (Resolve-Path $pack[0].filename).Path
          $prefix = Join-Path $env:RUNNER_TEMP 'spec-first-windows-prefix'
          npm install --global --prefix $prefix $tarball
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $prefix 'spec-first.cmd') --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate installed cmd shim
        shell: cmd
        run: '"%RUNNER_TEMP%\spec-first-windows-prefix\spec-first.cmd" --help'

      - name: 验证安装包重复初始化与宿主检查
        shell: pwsh
        run: |
          $cli = Join-Path $env:RUNNER_TEMP 'spec-first-windows-prefix/spec-first.cmd'
          $env:HOME = $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'spec-first-home'
          $env:CODEX_HOME = Join-Path $env:HOME '.codex'
          $env:SPEC_FIRST_NO_UPDATE_NOTIFIER = '1'
          $project = Join-Path $env:RUNNER_TEMP 'spec-first test project'
          New-Item -Type Directory -Path $project,$env:HOME -Force | Out-Null
          Set-Location -LiteralPath $project
          Set-Content AGENTS.md '# user-owned'
          foreach ($attempt in 1..2) {
            & $cli init --codex --cursor -y -u ci --lang zh
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Select-String -Quiet -SimpleMatch '# user-owned' AGENTS.md)) { throw 'User instructions lost' }
            $current = (Get-FileHash AGENTS.md).Hash
            if ($attempt -eq 2 -and $current -ne $previous) { throw 'Repeated init changed instructions' }
            $previous = $current
          }
          foreach ($hostId in 'codex','cursor') {
            $report = & $cli doctor "--$hostId" --json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $report | node (Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/assert-installed-runtime.cjs') $hostId
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
