id: open-ended-routes-debug
title: "Open bug descriptions should be routed to spec-debug"
description: "Verify routing preference for description: \"Use spec-debug for open-ended bugs\" — For troubleshooting requests with no errors, no stack traces, and no specific symptoms, assign spec-debug."

input:
  prompt: |
    （spec-work skill 已安装，请按它工作。）
    这个服务感觉哪里不太对,你说不上来哪里怪,帮我看看修一下。

context:
  repo_fixture: evals/fixtures/repos/reqonly-plan
  git:
    init: true
    checkout: main

expect:
  must_contain:
    - "spec-debug"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-debug"]
