id: drifted-pack-rejects
title: A stale task pack is rejected without implementation
description: |
  Compare the final fixture against its explicit pre-task baseline. File bytes,
  source inventory, HEAD and index are checked; wording alone is not outcome proof.
input:
  prompt: |
    First run `node prepare-eval.cjs` once to prepare this isolated fixture.
    Only that preparation may create its baseline commit; it grants no task commit authority.
    Then use the installed spec-work skill for this request:
    Execute docs/plans/2026-09-01-001-feat-month-filter-tasks.md.
context:
  repo_fixture: evals/fixtures/repos/drifted-pack
  git:
    init: true
    checkout: main
constraints:
  timeout_seconds: 600
  max_turns: 20
judge:
  type: script
  script_path: evals/fixtures/scripts/check-no-implementation.sh
  timeout_seconds: 30
