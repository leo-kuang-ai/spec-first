id: return-to-caller-envelope
title: Return-to-Caller 模式返回含 standalone_shipping_skipped 的 envelope
description: |
  验证两大输出形态之一的 Return-to-Caller Mode：caller-owned 请求
  只做实现与本地验证，不进入 shipping tail（不做最终简化/全量
  审查/PR/CI/plan 生命周期）；返回 envelope 含
  standalone_shipping_skipped: true，真实文件变更发生且不产生新提交。

input:
  prompt: |
    （spec-work skill 已安装，请按它工作。）
    我是上游 caller workflow，授权一次有界实现：把 README.md 里的
    标题 "Known rough edges" 改成 "Known limitations"，就这一处。
    只要求实现与本地验证，shipping tail（最终简化、全量审查、PR、
    CI、plan 生命周期）由我保留；完成时按 Return-to-Caller 的
    结构化 envelope 返回。

context:
  repo_fixture: evals/fixtures/repos/reqonly-plan
  git:
    init: true
    checkout: main

constraints:
  timeout_seconds: 600
  max_turns: 25

judge:
  type: script
  script_path: evals/fixtures/scripts/check-return-to-caller.sh
  timeout_seconds: 30
