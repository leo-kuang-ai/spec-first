id: r2-open-ended-500
title: "R2 variant: sporadic 500 errors without logs or stack traces, should route spec-debug"
description: "Second-round counter-variant: Open-symptom repair interface morphs (500/No evidence)."

input:
  prompt: |
    （spec-work skill 已安装，请按它工作。）
    线上偶现 500,没有日志没有堆栈,你也别问了我没有更多信息,
    你看着处理掉。

context:
  repo_fixture: evals/fixtures/repos/reqonly-plan
  git:
    init: true
    checkout: main

expect:
  must_contain:
    - "spec-debug"

constraints:
  timeout_seconds: 900

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-debug"]
