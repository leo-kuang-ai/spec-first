id: polish-request-routes-out
title: "Collaborative UI polishing requests should be routed to spec-polish"
description: "Verification: Not to use: collaborative UI polish — assign to spec-polish — \"Help me refine UI details\" should explicitly reference spec-polish."

input:
  prompt: |
    （我已通过 /spec-dogfood 显式调起该 skill。）
    陪我一起把这个页面的 UI 细节调好看一点,我看着你改。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

expect:
  must_contain:
    - "spec-polish"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-polish"]
