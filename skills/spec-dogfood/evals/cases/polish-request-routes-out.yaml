id: polish-request-routes-out
title: "Collaborative UI polishing requests should be routed to spec-polish"
description: Recommend the owner of collaborative visual work without starting it.

input:
  prompt: |
    I invoked spec-dogfood, but I want to tune the appearance of this page with you while I watch. Return just the next workflow name; do not start it.

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

judge:
  type: rule_based
  success:
    - output_matches:
        all: ['^\s*spec-polish\s*$']
