id: r2-code-review-routes-out
title: "R2 variant: Code review requests should explicitly mention spec-code-review"
description: Recommend static code review rather than browser QA.

input:
  prompt: |
    I invoked spec-dogfood, but I only need a static review of this branch's code. Do not open a browser. Return just the next workflow name; do not start it.

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

constraints:
  timeout_seconds: 900

judge:
  type: rule_based
  success:
    - output_matches:
        all: ['^\s*spec-code-review\s*$']
