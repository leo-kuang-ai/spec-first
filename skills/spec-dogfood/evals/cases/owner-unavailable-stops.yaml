id: owner-unavailable-stops
title: Missing browser owner on a branch with a real diff
description: The fixture stipulates the missing capability. An API-only repository is not evidence that the browser owner is missing.

input:
  prompt: |
    I invoked spec-dogfood to check the change to GET /entries. Run `bash prepare-dogfood-fixture.sh` in this isolated checkout; only preparation may create commits. Inspect the branch and committed diff against main. For this fixture the browser execution owner is unavailable. Do not start a server, run a browser, install anything or push. Return only JSON with reason (trunk_target or owner_unavailable), browser_scenarios_exercised (a number), and next_action (provide_branch or the name of the workflow for inspecting readiness).

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: feature/entries-response

judge:
  type: script
  script_path: evals/fixtures/scripts/check-owner-unavailable-stop.sh
  timeout_seconds: 30
