id: trunk-target-rejected
title: "Specifying trunk as the target should be rejected"
description: "Verify Failure Modes (trunk target with no diff): When the target is resolved to the trunk itself and there is no diff, dogfood should be denied/require a feature branch; do not escalate to full application exploration."

input:
  prompt: |
    I invoked spec-dogfood on the branch main, not on a PR. Inspect the current branch, then report whether this target can be tested. Do not switch branches or start a browser or server. For this fixture return only JSON with reason (trunk_target or owner_unavailable), browser_scenarios_exercised (a number), and next_action (provide_branch or the name of the workflow for inspecting readiness).

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

judge:
  type: script
  script_path: evals/fixtures/scripts/check-trunk-reject.sh
  timeout_seconds: 30
