schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code

cases:
  files:
    - evals/cases/owner-unavailable-stops.yaml
    - evals/cases/trunk-target-rejected.yaml
    - evals/cases/polish-request-routes-out.yaml
    - evals/cases/r2-code-review-routes-out.yaml
  defaults:
    timeout_seconds: 600
    max_turns: 16
  parallelism: 1

report:
  formats: [json, html]
  artifacts: [transcript]
