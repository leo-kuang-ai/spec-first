id: r2-debug-request-routes-out
title: R2变体:调试请求应路由 spec-debug
description: |
  第二轮对抗变体:rule-miner 近邻路由换目的地(修复 bug→spec-debug)。

input:
  prompt: |
    （skill-up 评测框架说明：本仓库 .claude/skills/spec-rule-miner/SKILL.md 是被测 skill 的定义文件,已随仓库就位。本次运行不经过 Skill 工具调用——请直接完整读取该文件,把它视为已加载的工作指令,然后按它处理下面的输入。）
    服务发非法 JSON 会崩,帮我修一下这个 bug。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

expect:
  must_contain:
    - "spec-debug"

constraints:
  timeout_seconds: 900

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-debug"]
