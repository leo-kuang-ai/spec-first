id: review-request-routes-out
title: 审查请求应路由 spec-code-review
description: |
  验证近邻路由:代码质量评审走 spec-code-review(正文有编码)。

input:
  prompt: |
    （skill-up 评测框架说明：本仓库 .claude/skills/spec-rule-miner/SKILL.md 是被测 skill 的定义文件,已随仓库就位。本次运行不经过 Skill 工具调用——请直接完整读取该文件,把它视为已加载的工作指令,然后按它处理下面的输入。）
    帮我审查一下 src/server.js 的代码质量。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

expect:
  must_contain:
    - "spec-code-review"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-code-review"]
