id: refine-own-idea-routes-to-brainstorm
title: "Stop refining existing user ideas and steer toward spec-brainstorm"
description: "Verify entry boundary (description: \"use spec-brainstorm to refine the user's own idea\") versus hard exit: When a user already has an idea and requests refinement into requirements, the spec-ideate module must not perform brainstorming on the user's behalf; instead, the request must be explicitly redirected to spec-brainstorm."

input:
  prompt: |
    Use spec-ideate. I have chosen a daily stand-up summary tool for my team. Help turn my idea into requirements. This is a routing-only fixture: return just the name of the workflow that should own the next step. Do not start it.

judge:
  type: rule_based
  success:
    - output_matches:
        all: ['^\s*spec-brainstorm\s*$']
