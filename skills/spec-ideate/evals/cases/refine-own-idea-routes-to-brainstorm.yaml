id: refine-own-idea-routes-to-brainstorm
title: 打磨用户既有想法应停止并指向 spec-brainstorm
description: |
  验证入口边界（description: "use spec-brainstorm to refine the user's own idea" 与硬出口）：
  用户已有一个想法、要求打磨成需求时，spec-ideate 不得代行 brainstorm 的工作，
  应明确把该请求指向 spec-brainstorm。

input:
  prompt: |
    （spec-ideate skill 已安装，请按它工作。）
    我已经有一个想法：给团队做一个自动汇总每日站会进展的工具。
    帮我把这个想法打磨成需求。

expect:
  must_contain:
    - "spec-brainstorm"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-brainstorm"]
