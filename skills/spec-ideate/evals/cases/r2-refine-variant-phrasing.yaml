id: r2-refine-variant-phrasing
title: Route a settled product decision to implementation planning
description: Contrast a selected idea that still needs requirements with settled requirements that need a technical plan.

input:
  prompt: |
    Use spec-ideate. Our approved requirement is to send team leads one daily digest of submitted stand-up updates; people without updates must not be listed. Product scope and acceptance criteria are settled. We need an implementation plan, not more ideas. Return only the name of the next workflow; do not start it.

constraints:
  timeout_seconds: 900

judge:
  type: rule_based
  success:
    - output_matches:
        all: ['^\s*spec-plan\s*$']
