id: repo-grounded-e2e-writes-artifact
title: "Ideation artifacts should follow the complete workflow and be recorded in the repository."
description: "End-to-end validation of repo-grounded mode: Requests should center on the current repository's theme (improving retention of this accounting demo), and the skill must first perform codebase grounding before proceeding to divergence, critique, and ranking. The final ranked ideation artifact should be automatically written to docs/ideation/ (default format: HTML; if the directory does not exist under repo mode, it should be created). Assert invariant output: output must reference the docs/ideation path and produce an .html artifact; ideation quality, critique rationale, and ranking semantics must be manually verified by human review of the transcript."

input:
  prompt: |
    First run `node prepare-eval.cjs` once in the isolated fixture. Only preparation may make a baseline commit. Use spec-ideate to propose and rank ways to improve retention in this ledger demo. Save one HTML document and give me its repository-relative path. Do not stage or commit it.

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

constraints:
  timeout_seconds: 1200
  max_turns: 40

expect:
  must_contain:
    - "docs/ideation"
    - ".html"

judge:
  type: script
  script_path: evals/fixtures/scripts/check-ideation-artifact.sh
  timeout_seconds: 30
