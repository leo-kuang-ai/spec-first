id: surprise-me-no-repo-needs-substance
title: "When there's no warehouse, the Surprise me action must first request materials and end cleanly."
description: "Verify the determinism of the surprise-me routing: when CWD is not within a git repo, route to the elsewhere mode, and a minimum of one material (URL / description / paste) must be collected before proceeding; if the user fails to provide such material, clearly indicate what is required and cleanly terminate—no artifacts should be generated or produced without explicit input."

input:
  prompt: |
    Use spec-ideate. Surprise me with some directions; the choice of focus is yours. There is no project checkout or other material for this request.

expect:
  files_not_exist:
    - "docs/ideation"

constraints:
  timeout_seconds: 480

judge:
  type: agent_judge
  model: anthropic/claude-haiku-4-5
  criteria:
    - "Pass only if a user-facing request or question tool asks for at least one usable source (for example a link, pasted draft or short description) and leaves ideation pending. Accept an imperative without a question mark. Declaring input unnecessary, quoting a request, or delivering ideas as if a source existed fails."
  pass_threshold: 1
