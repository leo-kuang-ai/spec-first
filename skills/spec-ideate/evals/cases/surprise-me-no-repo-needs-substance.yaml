id: surprise-me-no-repo-needs-substance
title: "When there's no warehouse, the Surprise me action must first request materials and end cleanly."
description: "Verify the determinism of the surprise-me routing: when CWD is not within a git repo, route to the elsewhere mode, and a minimum of one material (URL / description / paste) must be collected before proceeding; if the user fails to provide such material, clearly indicate what is required and cleanly terminate—no artifacts should be generated or produced without explicit input."

input:
  prompt: |
    （spec-ideate skill 已安装，请按它工作。）
    随便给我一些惊喜的方向吧，你看着办。

expect:
  files_not_exist:
    - "docs/ideation"

constraints:
  timeout_seconds: 480

judge:
  type: script
  script_path: evals/fixtures/scripts/asks-a-question.sh
  timeout_seconds: 30
