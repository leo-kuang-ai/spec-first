id: vague-subject-gate-asks
title: "Ambiguous requests without a clear topic should trigger a scope inquiry rather than directly generating a response."
description: "Verify Subject-Identification Gate: The bare phrase \"give me some improvement suggestions\" must not identify a topic; the skill must pose a scope question (including a \"Surprise me\" option concept), with language unrestricted. It must not silently interpret vague requests as \"about this repository\" and immediately generate ideas or artifacts. Assert invariant behavior: when a question appears and no output phase has begun; option phrasing and template words are manually verified against transcript."

input:
  prompt: |
    Use spec-ideate. Give me some improvement ideas.

expect:
  files_not_exist:
    - "docs/ideation"

constraints:
  timeout_seconds: 480

judge:
  type: agent_judge
  model: anthropic/claude-haiku-4-5
  criteria:
    - "Pass only if the assistant asks the user to identify the subject or delegate that choice, and waits without silently choosing the repository or giving the ideas. Use the actual question tool or user-facing request. An imperative can ask for input; a question mark, quoted request or unsolicited completion cannot."
  pass_threshold: 1
