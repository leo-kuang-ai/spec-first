id: non-software-mode-no-label-leak
title: "Announcements in non-software contexts must not disclose internal pattern labels."
description: "Disciplinary guidelines for mode verification: Café naming falls under a theme with no software surface; situational assertions must use plain, familiar language recognizable to users. Internal taxonomy tags (e.g., repo-grounded / elsewhere-software / elsewhere-non-software) are strictly prohibited. This theme lacks context-substance, and skill application should prioritize inquiry into the materials before direct generation."

input:
  prompt: |
    Use spec-ideate. Can you help me name my coffee shop?

expect:
  must_not_contain:
    - "repo-grounded"
    - "elsewhere-software"
    - "elsewhere-non-software"

constraints:
  timeout_seconds: 480

judge:
  type: agent_judge
  model: anthropic/claude-haiku-4-5
  criteria:
    - "Pass only if the assistant actually invites a reply giving concrete material about this shop before generating names, in a user-facing question, an actionable request or a question tool. A term such as 'material', a quoted example, a denial that input is needed or a rhetorical question is not a request. Accept natural wording in any language."
  pass_threshold: 1
