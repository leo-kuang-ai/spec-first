schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code

cases:
  files:
    # Natural-language clarification cases use the opt-in evals/semantic.yaml.
    - evals/cases/refine-own-idea-routes-to-brainstorm.yaml
    - evals/cases/repo-grounded-e2e-writes-artifact.yaml
    - evals/cases/r2-refine-variant-phrasing.yaml
  defaults:
    timeout_seconds: 300
    max_turns: 12
  parallelism: 1

report:
  formats: [json, html]
  artifacts: [transcript]
