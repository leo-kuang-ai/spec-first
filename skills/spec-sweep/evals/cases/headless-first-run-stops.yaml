id: headless-first-run-stops
title: "headless first run requires interactive setup and stops"
description: "Verify Setup gate: On first run (in unconfigured state) in headless mode, it must report \"first run requires interactive setup\" and halt, without inferring source configuration."

input:
  prompt: |
    （skill-up 评测框架说明：本仓库 .claude/skills/spec-sweep/SKILL.md 是被测
    skill 的定义文件,已随仓库就位。本次运行不经过 Skill 工具调用——请直接完整
    读取该文件,把它视为已加载的工作指令,然后按它处理下面的输入。输入形态:
    定时调度器触发,无人在场。）
    mode:headless

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

expect:
  must_contain:
    - "first run requires interactive setup"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["first run requires interactive setup"]
