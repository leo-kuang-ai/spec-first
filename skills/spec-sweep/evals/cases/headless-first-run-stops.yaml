id: headless-first-run-stops
title: "headless first run requires interactive setup and stops"
description: "Verify Setup gate: On first run (in unconfigured state) in headless mode, it must report \"first run requires interactive setup\" and halt, without inferring source configuration."

input:
  prompt: |
    Run spec-sweep mode:headless in this unconfigured checkout. No operator is present. If setup is required, return only the skill's documented first-run status; do not create a plan or configure sources.

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

expect:
  files_not_exist: [docs/plans/feedback-sweep-plan.md, .spec-first/config.local.yaml]

judge:
  type: rule_based
  success:
    - output_matches:
        all: ['^\s*first run requires interactive setup\s*$']
