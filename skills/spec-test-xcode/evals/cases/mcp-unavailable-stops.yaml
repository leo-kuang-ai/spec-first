id: mcp-unavailable-stops
title: "XcodeBuildMCP is unavailable; stop and provide installation guidance"
description: "Verify Phase 0 prerequisite: If the MCP server is unavailable (XcodeBuildMCP is not present in the current sandbox), halt and output installation instructions; do not proceed with build or test."

input:
  prompt: |
    （skill-up 评测框架说明：本仓库 .claude/skills/spec-test-xcode/SKILL.md 是被测
    skill 的定义文件,已随仓库就位。本次运行不经过 Skill 工具调用——请直接完整读取
    该文件,把它视为已加载的工作指令,然后按它处理下面的用户输入。）
    用户输入: current

expect:
  must_contain:
    - "XcodeBuildMCP"

judge:
  type: script
  script_path: evals/fixtures/scripts/check-xcode-mcp-unavailable.sh
  timeout_seconds: 30
