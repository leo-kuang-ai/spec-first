id: mcp-unavailable-stops
title: XcodeBuildMCP 不可用应停止并给安装指引
description: |
  验证 Phase 0 前置:MCP server 不可用(当前沙箱无 XcodeBuildMCP)时
  停止并输出安装指引,不继续 build/test。

input:
  prompt: |
    （skill-up 评测框架说明：本仓库 .claude/skills/spec-test-xcode/SKILL.md 是被测
    skill 的定义文件,已随仓库就位。本次运行不经过 Skill 工具调用——请直接完整读取
    该文件,把它视为已加载的工作指令,然后按它处理下面的用户输入。）
    用户输入: current

expect:
  must_contain:
    - "XcodeBuildMCP"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["XcodeBuildMCP"]
