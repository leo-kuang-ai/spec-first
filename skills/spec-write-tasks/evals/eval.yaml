schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code

cases:
  files:
    - evals/cases/bare-request-asks-path.yaml
    - evals/cases/remote-input-rejected.yaml
    - evals/cases/small-plan-skip.yaml
    - evals/cases/non-active-rejected.yaml
  defaults:
    timeout_seconds: 480
    max_turns: 14
  parallelism: 1

report:
  formats: [json, html]
  artifacts: [transcript]
