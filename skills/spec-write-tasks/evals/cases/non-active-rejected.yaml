id: non-active-rejected
title: "Inactive plans must not be compiled into executable task packages"
description: "Verify Core Rule 10:status: completed plans return source_plan_non_active, generating no executable task pack and no routing of spec-work."

input:
  prompt: |
    （spec-write-tasks skill 已安装，请按它工作。）
    docs/plans/2026-08-01-001-feat-old-thing-plan.md 帮我拆成任务包准备执行。

context:
  repo_fixture: evals/fixtures/repos/done-plan
  git:
    init: true
    checkout: main

expect:
  must_contain:
    - "source_plan_non_active"
  files_not_exist:
    - "docs/tasks"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["source_plan_non_active"]
