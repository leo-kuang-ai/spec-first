id: small-plan-skip
title: "Small, low-risk initiatives should lean toward skipping direct spec-work."
description: "Verify the skip branch: a small, single-implementation unit active plan, with no increase in execution risk or overhead in derived layers—decision should favor skip (direct to spec-work) or at least recommend skip and explicitly highlight spec-work."

input:
  prompt: |
    （spec-write-tasks skill 已安装，请按它工作。）
    docs/plans/2026-09-01-001-feat-month-filter-plan.md 帮我拆成任务包。

context:
  repo_fixture: evals/fixtures/repos/tiny-plan
  git:
    init: true
    checkout: main

expect:
  must_contain:
    - "spec-work"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-work"]
