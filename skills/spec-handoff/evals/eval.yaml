schema_version: v1alpha1
environment:
  type: none
skills:
  - source: local_path
    path: .
engine:
  name: claude_code
cases:
  files:
    - evals/cases/ordinary-continuation-not-triggered.yaml
    - evals/cases/create-produces-gate-fields.yaml
    - evals/cases/resume-explicit-source-stops-without-acting.yaml
    - evals/cases/resume-sparse-source-degraded-orientation.yaml
defaults:
  timeout_seconds: 480
  max_turns: 12
  parallelism: 1
report:
  formats: [json, html]
  artifacts: [transcript]
