id: create-produces-gate-fields
title: "create output containing gate four-field spec-handoff/v1 artifact"
description: "Verify the create main path: explicitly create an handoff when the writer within the package produces a managed artifact, and the frontmatter contains the handoff gate fields (summary/source_refs/freshness/limitations) and is non-empty; judge computes the actual SHA-256 of the same artifact and requires a report that includes an exact, reproducible resume call pointing to that file."

input:
  prompt: |
    （spec-handoff skill 已安装，请按它工作。）
    给当前 mini-ledger 的工作创建一个跨会话交接：create handoff。
    背景：我们刚给 src/server.js 的 GET /entries 加了 limit 分页并本地验证通过；
    下一步是加分类汇总接口，下个会话继续做。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

constraints:
  timeout_seconds: 600
  max_turns: 30

judge:
  type: script
  script_path: evals/fixtures/scripts/check-create-artifact.sh
  timeout_seconds: 30
