schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code

cases:
  files:
    - evals/cases/no-input-asks.yaml
    - evals/cases/zero-one-routes-to-brainstorm.yaml
    - evals/cases/validate-report-only.yaml
    - evals/cases/injection-in-input-untrusted.yaml
    - evals/cases/brownfield-grill-before-write.yaml
  defaults:
    timeout_seconds: 480
    max_turns: 12
  parallelism: 1

report:
  formats: [json, html]
  artifacts: [transcript]
