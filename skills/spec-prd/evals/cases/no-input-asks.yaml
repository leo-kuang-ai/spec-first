id: no-input-asks
title: "Empty input should first prompt for the target increment or PRD path"
description: "Verify Input gate: Without prd_input invocation, consult SKILL.md to determine the target increment or existing PRD path; do not advance the stage or deliver a PRD prior to receiving input."

input:
  prompt: |
    （spec-prd skill 已安装，请按它工作。）

expect:
  files_not_exist:
    - "docs/brainstorms"

judge:
  type: script
  script_path: evals/fixtures/scripts/asks-a-question.sh
  timeout_seconds: 30
