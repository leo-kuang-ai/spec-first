id: brownfield-grill-before-write
title: "The create operation for brownfield increments should first undergo grill processing rather than employing read-after-write PRD."
description: "Verify direct-write-after-read anti-pattern protection and grill default path: coarse increment create requests, where the correct behavior when no owner responds in a single round is Decision Card + one-at-a-time questioning to the owner, not producing a final PRD upon reading. In headless mode, legitimate recovery is checkpoint-PRD (not ready), and ready declarations are likewise prohibited."

input:
  prompt: |
    （spec-prd skill 已安装，请按它工作。）
    这个记账 demo 想加一个"月度支出汇总"能力:用户能看到当月总支出和分类占比。
    帮我写 PRD。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

expect:
  files_not_exist:
    - "docs/brainstorms"

judge:
  type: script
  script_path: evals/fixtures/scripts/asks-a-question.sh
  timeout_seconds: 30
