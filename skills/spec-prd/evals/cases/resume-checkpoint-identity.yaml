id: resume-checkpoint-identity
title: "The interrupted checkpoint PRD shall use the existing spec_id and the already-closed decision; no new PRD shall be reopened or declared ready."
description: "Verify the resume-risk trigger surface: when a checkpoint PRD (can_enter_spec_plan: no, pending OQ) is resumed after interruption, it must retain the spec_id identity and the previously closed decision; incremental writes and continuation of asking next_owner_question are allowed, but no new PRD path shall be initiated, and no claim of ready-for-planning or can_enter_spec_plan: yes shall be made until the OQ is closed."
input:
  prompt: |
    First run `node prepare-eval.cjs` once to prepare this isolated fixture.
    Only that preparation may create its baseline commit; it grants no task commit authority.
    （spec-prd skill 已安装，请按它工作。）

    上次会话在这个仓库写 PRD 写到一半中断了，产物在
    docs/brainstorms/2026-10-15-001-loyalty-ledger-prd.md。
    请接着往下做（resume）。
context:
  repo_fixture: evals/fixtures/repos/large-resume
  git:
    init: true
    checkout: main
constraints:
  timeout_seconds: 480
  max_turns: 12
judge:
  type: script
  script_path: evals/fixtures/scripts/check-resume-identity.sh
  timeout_seconds: 30
