id: validate-report-only
title: Readiness validation preserves the complete PRD bytes
description: |
  Check the actual fixture outcome and protected state rather than completion wording.
  Preparation records the isolated pre-task HEAD, index and fixture identity.
input:
  prompt: |
    First run `node prepare-eval.cjs` once in this isolated fixture.
    That preparation alone may create the baseline commit; no task commit or landing is authorized.
    Use spec-prd to validate planning readiness of docs/brainstorms/2026-09-01-expense-export-requirements.md. Return a report only; do not change the file.
context:
  repo_fixture: evals/fixtures/repos/rough-prd
  git:
    init: true
    checkout: main
constraints:
  timeout_seconds: 900
  max_turns: 30
judge:
  type: script
  script_path: evals/fixtures/scripts/check-validate-report-only.sh
  timeout_seconds: 30
