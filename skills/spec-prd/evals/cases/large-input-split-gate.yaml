id: large-input-split-gate
title: 超大输入应停在拆分确认请求或 checkpoint,不得未经确认产出拆分产物或 final PRD
description: |
  验证 oversized 触发面:多模块、多来源、含冲突与重复的整包需求输入,
  按 SKILL.md Intake split posture 与 assets/templates/70-large-requirement-index.md
  前置条件,必须在当前执行对话用户确认拆分边界前停在确认请求或 checkpoint-prd
  恢复形态;不得未经确认创建拆分总索引/子 PRD,不得声称 ready-for-planning。
input:
  prompt: |
    （spec-prd skill 已安装，请按它工作。）

    以下是一次性收到的完整需求输入（三份会议纪要合并整理，未做去重），请处理：

    === 需求池开始 ===
    【模块 A 账户与认证】
    A1 用户用手机号+验证码登录；验证码 60 秒有效。
    A2 已有邮箱密码登录，保留。
    A3 同一设备连续 5 次验证码输错，锁定 15 分钟。
    A4 高频登录尝试要有频控（具体阈值见安全组的会议结论）。
    A5 支持微信扫码登录（二期）。
    A6 登录态 30 天免登。
    A7 频控：同一账号 1 分钟内最多请求 3 次验证码。
    A8 注销账户需二次确认并保留 7 天可恢复期。

    【模块 B 积分规则】
    B1 每笔已完成订单发放积分，比例按商务组的最终结论执行。
    B2 会议一纪要：比例为订单金额 1%，向下取整。
    B3 会议三纪要：比例为订单金额 2%，封顶每单 50 分。
    B4 积分有效期：自获取日起 12 个月。
    B5 积分过期后账本要能查到过期记录。
    B6 邀请新用户注册成功，双方各得 100 分。
    B7 每日签到得 5 分，连续 7 天额外得 30 分。
    B8 积分发放要有防刷限制：同一用户同一商品每日最多发放一次。
    B9 退款订单要回冲对应积分，积分已消费时允许负余额并从后续发放中抵扣。

    【模块 C 积分消费】
    C1 积分可按 100 分=1 元抵扣订单金额。
    C2 抵扣比例：100 分=1 元，单笔订单最多抵扣 50%。
    C3 积分兑换商城礼品（三期，本轮不做详细设计但要留接口）。
    C4 消费顺序：先过期先消费。
    C5 单笔积分消费生成独立流水。
    C6 部分抵扣时剩余积分不动。

    【模块 D 账本与对账】
    D1 用户可查看积分明细流水（获取/消费/过期/回冲四类）。
    D2 流水支持按时间筛选与分页。
    D3 每月底生成对账单，异常差异要能导出。
    D4 对账单导出格式为 Excel。
    D5 运营侧可按用户维度查询积分余额与流水。
    D6 对账单导出格式为 CSV（数据组口径，Excel 是报告组口径，两口径并存）。
    D7 积分余额与流水总额不一致时要告警。

    【模块 E 通知】
    E1 积分到账推送 App 内消息。
    E2 积分即将过期（7 天内）推送提醒。
    E3 提醒渠道：App push；短信通道暂不启用。
    E4 用户可关闭过期提醒。

    【模块 F 管理后台】
    F1 运营可手工调整用户积分，需审批流。
    F2 手工调整要记录操作人与原因。
    F3 积分规则参数（比例/有效期/签到奖励）可配置，改动需审批并留痕。
    F4 配置改动实时生效。
    F5 提供积分发放总量/消费总量日报。

    【交叉约束】
    X1 本期范围不含商城兑换的详细设计（见 C3）。
    X2 所有积分变动接口要求幂等。
    X3 积分账本数据保留 3 年。
    X4 频控与防刷的最终阈值以安全组评审结论为准，纪要未收录。
    === 需求池结束 ===
expect:
  files_not_exist:
    - "docs/brainstorms/70-large-requirement-index.md"
judge:
  type: script
  script_path: evals/fixtures/scripts/check-large-split-gate.sh
  timeout_seconds: 30
