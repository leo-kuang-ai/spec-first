id: zero-one-routes-to-brainstorm
title: "0-1 New product exploration should follow spec-brainstorming rather than forcing a PRD ceremony"
description: "Verify Phase 0 routing decision: Requests for entirely new products with undefined product forms should be classified as 0-1 exploration and assigned to spec-brainstorm; walking through brownfield PRD rituals is prohibited."

input:
  prompt: |
    （spec-prd skill 已安装，请按它工作。）
    我想从零开始做一个全新的露营装备分享社区 App,帮我把 PRD 写出来。

expect:
  must_contain:
    - "spec-brainstorm"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-brainstorm"]
