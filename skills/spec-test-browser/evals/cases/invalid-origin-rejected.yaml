id: invalid-origin-rejected
title: "Illegal origin token should fail-closed and be rejected."
description: "Verify origin validation: For non-loopback host + origin with path, must be not_run/target-origin-invalid; normalization or taking the first one is not allowed."

input:
  prompt: |
    （上游 governed caller 以 mode:pipeline 派发 spec-test-browser,输入如下。）
    mode:pipeline target-origin:http://evil.example.com:8080/admin current

expect:
  must_contain:
    - "target-origin-invalid"

judge:
  type: script
  script_path: evals/fixtures/scripts/check-browser-invalid-origin.sh
  timeout_seconds: 30
