id: missing-origin-not-run
title: "In pipeline mode, if origin is missing, return not_run without inference."
description: "Verify fail-closed contract:mode:pipeline returns not_run/target-origin-missing when target-origin is absent, does not search for package scripts, does not infer ports, and does not start the server."

input:
  prompt: |
    （上游 governed caller 以 mode:pipeline 派发 spec-test-browser,输入如下。）
    mode:pipeline current

expect:
  must_contain:
    - "target-origin-missing"

judge:
  type: script
  script_path: evals/fixtures/scripts/check-browser-missing-origin.sh
  timeout_seconds: 30
