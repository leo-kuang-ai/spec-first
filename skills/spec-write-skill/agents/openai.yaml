interface:
  display_name: "Write Skill"
  short_description: "Author owned Skills or validate packages read-only"
  default_prompt: "Use the spec-write-skill workflow for explicit project-owned Skill authoring, migration, or remediation, or for an explicitly requested validate-only check of an existing or external package. Resolve one target repo and canonical source first, keep external or unknown packages read-only, preview mutations, and report portable, target, project, semantic, and mutation readiness separately."

policy:
  allow_implicit_invocation: false
