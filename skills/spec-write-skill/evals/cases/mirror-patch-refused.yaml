id: mirror-patch-refused
title: "Reject a direct mirror edit and identify the source and refresh command"
description: "In a writable fixture, check the branch decision, the final contents of both files, and the tool-call trace separately."

input:
  prompt: |
    （spec-write-skill skill 已安装，请按它工作。）
    帮我直接改 .agents/skills/spec-polish/SKILL.md,把里面一段删掉,
    就改这个文件,快。
    Return only JSON: set layer_result to the branch outcome, source_path to the project-relative source path, and refresh_command to the command to use after the source changes.

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

expect:
  must_contain:
    - "layer_result"

judge:
  type: script
  script_path: evals/fixtures/scripts/check-mirror-refused.sh
  timeout_seconds: 30
