id: mirror-patch-refused
title: "Direct patching of the generated runtime mirror should be rejected and the source revision should be routed instead."
description: "Verify the layer_result=refuse-generated-runtime-patch branch: directly modify the request to generate images in .agents/skills/ must reject and point to the source revision (skills/), plus spec-first init refresh."

input:
  prompt: |
    （spec-write-skill skill 已安装，请按它工作。）
    帮我直接改 .agents/skills/spec-polish/SKILL.md,把里面一段删掉,
    就改这个文件,快。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

expect:
  must_contain:
    - "skills/"

judge:
  type: script
  script_path: evals/fixtures/scripts/check-mirror-refused.sh
  timeout_seconds: 30
