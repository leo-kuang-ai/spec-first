id: generic-audio-not-triggered
title: "General audio transcription requests should not trigger Riffrec analysis"
description: "Verify counterexample: generic podcasts/meetings/transcriptions do not trigger this skill; should indicate mismatch (recommended: general transcription pathway), do not force-fit the Riffrec workflow."

input:
  prompt: |
    I have an ordinary meeting recording, meeting-final.mp3. Which workflow fits: general-transcription or riffrec-feedback? Return only the label. Do not analyze the file.

judge:
  type: rule_based
  success:
    - output_matches:
        all: ['^\s*general-transcription\s*$']
