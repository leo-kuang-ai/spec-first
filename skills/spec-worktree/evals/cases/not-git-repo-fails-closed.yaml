id: not-git-repo-fails-closed
title: "Non-Git directories must detect fail-closed; bare-running git worktree add is prohibited."
description: "Verify fail-closed contract: On non-git directories, if detect returns a structured state/reason_code (not-git-repo or unknown), halt and report the cause; do not roll back to a bare git worktree add, and do not create .worktrees."

input:
  prompt: |
    （spec-worktree skill 已安装，请按它工作。你是 governed caller，
    caller 身份=PR 审查隔离，target repo=当前目录，目标 ref=main，
    隔离原因=保持主 checkout 干净。）
    请按 skill 为当前目录建立隔离并汇报。

context:
  repo_fixture: evals/fixtures/repos/plain-app-nogit

judge:
  type: script
  script_path: evals/fixtures/scripts/check-not-git-refuses.sh
  timeout_seconds: 30
