id: governed-caller-create-worktree
title: "governed caller: upon detection, creates a new-work worktree while the main checkout remains unchanged"
description: "Validate core flow: For caller-owned isolation requests, they must first pass the detect contract of the bundled script (spec-worktree-detect.v1); under ordinary-checkout, a .worktrees/<branch> directory is created, the main checkout branch and HEAD remain unchanged, .gitignore is updated to include .worktrees, and the report includes ready status and path semantics."

input:
  prompt: |
    这是一个隔离评测工作区。先运行 `bash prepare-worktree-fixture.sh` 建立初始提交；
    该命令仅用于准备评测环境，不属于被测行为。
    （spec-worktree skill 已安装，请按它工作。你是 governed caller，
    提供 caller-owned 隔离契约：caller 身份=并行特性开发，target repo=
    当前仓库，新分支名 feat-pagination，隔离原因=并行开发保持主分支干净，
    允许的 setup 副作用=.worktrees 目录与 .gitignore 条目，不复制 env 文件。）
    请按 skill 完成隔离并汇报结果与切换路径。

context:
  repo_fixture: evals/fixtures/repos/plain-app
  git:
    init: true
    checkout: main

constraints:
  timeout_seconds: 600
  max_turns: 20

judge:
  type: script
  script_path: evals/fixtures/scripts/check-create-worktree.sh
  timeout_seconds: 30
