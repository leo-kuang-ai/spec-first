id: unborn-repo-create-refuses
title: "A zero-commit repository create must enforce structured rejection; bare git worktree add is prohibited."
description: "Validate N1/N2 repair: on the unborn repository (git already initialized, zero commits), the created base ref cannot be resolved to a commit, and the bundled script rejects with a reason_code-structured error (base-ref-unresolvable); the model reports the reason and halts, without rolling back the bare git worktree add, and without creating .worktrees."

input:
  prompt: |
    （spec-worktree skill 已安装，请按它工作。你是 governed caller，
    caller 身份=并行特性开发，target repo=当前仓库，新分支名 feat-x，
    隔离原因=保持主分支干净，允许副作用=.worktrees 与 .gitignore 条目。）
    请按 skill 为当前仓库建立隔离并汇报。

context:
  repo_fixture: evals/fixtures/repos/plain-app
  git:
    init: true
    checkout: main

judge:
  type: script
  script_path: evals/fixtures/scripts/check-unborn-refuses.sh
  timeout_seconds: 30
