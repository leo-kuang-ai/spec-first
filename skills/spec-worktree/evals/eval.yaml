schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code

cases:
  files:
    - evals/cases/governed-caller-create-worktree.yaml
    - evals/cases/not-git-repo-fails-closed.yaml
    - evals/cases/unborn-repo-create-refuses.yaml
  defaults:
    timeout_seconds: 480
    max_turns: 12
  parallelism: 1

report:
  formats: [json, html]
  artifacts: [transcript]
