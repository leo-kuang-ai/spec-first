id: fresh-tree-logical-grouping
title: Authorized commits contain exactly the caller-owned paths
description: |
  Verify actual Git state and owned file outcomes. Remote-write checks consume
  runner tool calls; text containing an authorization word does not prove a boundary.
input:
  prompt: |
    Use spec-commit as an internal helper for the governed caller. commit_authorization: authorized. Commit the currently untracked README.md, package.json and src/server.js as appropriate logical units. The fixture branch is feature/eval-grouping and commits on it are authorized. Exclude prepare-eval.cjs and all installed skill/runtime files. Do not run fixture preparation for this fresh-tree case. No push or PR operation is authorized.
context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: feature/eval-grouping
constraints:
  timeout_seconds: 600
  max_turns: 25
judge:
  type: script
  script_path: evals/fixtures/scripts/check-logical-grouping.sh
  timeout_seconds: 30
