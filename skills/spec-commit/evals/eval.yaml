schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code

cases:
  files:
    - evals/cases/no-auth-stops-before-staging.yaml
    - evals/cases/fresh-tree-logical-grouping.yaml
  defaults:
    timeout_seconds: 480
    max_turns: 12
  parallelism: 1

report:
  formats: [json, html]
  artifacts: [transcript]
