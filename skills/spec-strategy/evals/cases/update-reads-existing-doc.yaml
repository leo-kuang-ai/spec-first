id: update-reads-existing-doc
title: "Read the existing documentation carefully before updating and provide a summary of the current status."
description: "Verify Phase 2 file reading discipline: Update run with complete reading of STRATEGY.md, output a 3-5 line summary of current status—assertions must reference unique content from the fixture (LedgerFlow, reconciliation duration) to prove actual reading rather than template replication."

input:
  prompt: |
    （spec-strategy skill 已安装，请按它工作。）
    策略文档过时了,过一遍。

context:
  repo_fixture: evals/fixtures/repos/existing-strategy
  git:
    init: true
    checkout: main

expect:
  must_contain:
    - "LedgerFlow"
    - "对账"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["LedgerFlow", "对账"]
