id: update-reads-existing-doc
title: "Read the existing documentation carefully before updating and provide a summary of the current status."
description: Assess whether the summary accurately represents the existing strategy. The summary alone cannot establish how the agent obtained those facts.

input:
  prompt: |
    Use spec-strategy. Our strategy might be out of date. Summarize what it actually says before proposing changes.

context:
  repo_fixture: evals/fixtures/repos/existing-strategy
  git:
    init: true
    checkout: main

judge:
  type: agent_judge
  model: anthropic/claude-haiku-4-5
  criteria:
    - Accurately summarize the freelancer's three-spreadsheet reconciliation problem. Distinguish the current two hours from the under-ten-minute goal. Merely naming LedgerFlow, denying a read, or presenting the target as a measured improvement fails. Assess the summary, not an unsupported claim about tool use.
  pass_threshold: 1
