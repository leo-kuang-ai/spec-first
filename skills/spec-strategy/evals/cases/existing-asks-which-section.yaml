id: existing-asks-which-section
title: "For existing strategies with no parameters, ask which section to revisit."
description: "Verify Phase 0 Third Branch: STRATEGY.md exists and the section is not specified; when prompted, ask the user with a blocking question (or degraded numbering option) to revisit a specific part, without silently rewriting. After a target is selected, proceed in the update-run order: first read the full text, summary, and corresponding scope checks, then process the selected target (the summary and scope checks must not be skipped, as they are separately covered by the update case)."

input:
  prompt: |
    Use spec-strategy. Update our existing strategy.

context:
  repo_fixture: evals/fixtures/repos/existing-strategy
  git:
    init: true
    checkout: main

judge:
  type: agent_judge
  model: anthropic/claude-haiku-4-5
  criteria:
    - Invite the owner to choose a section of the existing strategy before revising it. Ground the choice in the current document. Starting a new interview, asking only for unspecified materials or claiming the rewrite is done fails.
  pass_threshold: 1
