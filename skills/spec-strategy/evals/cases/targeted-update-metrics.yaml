id: targeted-update-metrics
title: "The specified section shall be revisited specifically for that section and the rest shall be retained."
description: Assess whether the follow-up addresses an existing measure without reopening unrelated sections. This case does not verify file preservation.

input:
  prompt: |
    Use spec-strategy. I want to revisit our metrics.

context:
  repo_fixture: evals/fixtures/repos/existing-strategy
  git:
    init: true
    checkout: main

judge:
  type: agent_judge
  model: anthropic/claude-haiku-4-5
  criteria:
    - Revisit an existing measure such as reconciliation time or weekly importers. Ask about its definition, target, measurement or decision value without asking which section to revisit or declaring an unapproved change.
  pass_threshold: 1
