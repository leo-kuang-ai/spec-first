id: targeted-update-metrics
title: 指定 section 应定向重访该 section 并保留其余
description: |
  验证 Phase 0 第二分支 + Phase 2:参数命名 metrics 时跳到该 section 重新面试
  (带 pushback),其他 section 不动;单轮正确形态是宣告 found + 定向提问。
  section 名允许中英变体(指标/metrics),定向性由 transcript 核验。

input:
  prompt: |
    （spec-strategy skill 已安装，请按它工作。）
    metrics 这部分想重新过一遍。

context:
  repo_fixture: evals/fixtures/repos/existing-strategy
  git:
    init: true
    checkout: main

judge:
  type: script
  script_path: evals/fixtures/scripts/asks-a-question.sh
  timeout_seconds: 30
