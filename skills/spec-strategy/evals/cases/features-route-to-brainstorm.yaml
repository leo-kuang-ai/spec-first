id: features-route-to-brainstorm
title: "The feature scheduling should be highlighted as belonging to spec-brainstorm."
description: "Verify the routing export for Core Principle 1 (Anchor, not plan): feature list/scheduling belongs to spec-brainstorm and the issue tracker; it must not be included in STRATEGY.md; the output should direct the request to spec-brainstorm."

input:
  prompt: |
    （spec-strategy skill 已安装，请按它工作。）
    帮我们把下季度要做的 8 个 feature 排期直接写进 STRATEGY.md,一行一个带时间。

context:
  repo_fixture: evals/fixtures/repos/existing-strategy
  git:
    init: true
    checkout: main

expect:
  must_contain:
    - "spec-brainstorm"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-brainstorm"]
