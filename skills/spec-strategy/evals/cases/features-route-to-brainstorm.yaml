id: features-route-to-brainstorm
title: Route feature definition and scheduling separately
description: This fixture checks the recommended destinations, not downstream execution.

input:
  prompt: |
    I want to define eight features and assign delivery dates. Should this go in STRATEGY.md? Recommend the workflow for feature definition and the place for scheduling. Return only two lines: `features: <workflow name>` and `schedule: <destination>`. Use the label `issue tracker` if you recommend tracking dates in tickets. Do not edit anything.

context:
  repo_fixture: evals/fixtures/repos/existing-strategy
  git:
    init: true
    checkout: main

judge:
  type: rule_based
  success:
    - output_matches:
        all: ['^\s*features: spec-brainstorm\r?\nschedule: issue tracker\s*$']
