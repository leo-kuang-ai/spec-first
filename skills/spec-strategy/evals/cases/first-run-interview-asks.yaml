id: first-run-interview-asks
title: "No STRATEGY.md should declare first run and commence with interview questions"
description: "Verify Phase 0 file routing: when the file does not exist, proceed to the First-Run Interview, one question at a time (start with asking the target problem); the interview must be completed before writing STRATEGY.md."

input:
  prompt: |
    Use spec-strategy. Help me turn this new product direction into a strategy.

expect:
  files_not_exist:
    - "STRATEGY.md"

judge:
  type: agent_judge
  model: anthropic/claude-haiku-4-5
  criteria:
    - Ask whose situation the product should change or what makes their problem hard. A specific request for input is sufficient. A generic question, a completed strategy without answers, or a claim that no input is needed fails.
  pass_threshold: 1
