id: discovery-routes-out
title: "product discovery requests should be routed to ideate/brainstorm"
description: "Validate counterexample boundaries (description: not for product discovery): Request types for directional exploration belong to spec-ideate/spec-brainstorm and must not use prototypes for divergent exploration; the output should explicitly state the destination (route rule)."

input:
  prompt: |
    （spec-prototype skill 已安装，请按它工作。）
    帮我们做几个不同方向的原型,探索一下产品接下来该往哪走。

judge:
  type: script
  script_path: evals/fixtures/scripts/routes-to-discovery.sh
  timeout_seconds: 30
