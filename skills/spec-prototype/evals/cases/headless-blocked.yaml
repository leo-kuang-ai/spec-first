id: headless-blocked
title: "Block startup in unattended mode."
description: "Verification of human-experience is a hard prerequisite: in unattended/pipeline mode, if human experience is not feasible, the system must return `blocked-human-experience-required` and refrain from initiating the build."

input:
  prompt: |
    （spec-prototype skill 已安装，请按它工作。）
    我要下班了,你无人值守帮我把原型做完,明早我直接看结果。

expect:
  must_contain:
    - "blocked-human-experience-required"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["blocked-human-experience-required"]
