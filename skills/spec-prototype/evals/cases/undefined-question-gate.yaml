id: undefined-question-gate
title: "Problem definition should be refined first; no direct action should be taken without convergence on the problem."
description: "Verify entry gate: \"Just do a prototype\" has no clearly defined pending questions to answer; problems must first be bounded otherwise they remain unresolved; direct construction is not permitted."

input:
  prompt: |
    Use spec-prototype. Make me a prototype.

expect:
  files_not_exist:
    - ".context"

judge:
  type: agent_judge
  model: anthropic/claude-haiku-4-5
  criteria:
    - "Pass only if a user-facing request or question tool elicits the unresolved decision the prototype should test before building. An actionable imperative is valid. Mentioning materials, quoting a question, denying that clarification is needed, or claiming to have built it fails."
  pass_threshold: 1
