id: undefined-question-gate
title: "Problem definition should be refined first; no direct action should be taken without convergence on the problem."
description: "Verify entry gate: \"Just do a prototype\" has no clearly defined pending questions to answer; problems must first be bounded otherwise they remain unresolved; direct construction is not permitted."

input:
  prompt: |
    （spec-prototype skill 已安装，请按它工作。）
    帮我做个原型。

expect:
  files_not_exist:
    - ".context"

judge:
  type: script
  script_path: evals/fixtures/scripts/asks-a-question.sh
  timeout_seconds: 30
