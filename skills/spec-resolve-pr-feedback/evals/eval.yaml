schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code

cases:
  files:
    - evals/cases/no-fix-auth-readonly.yaml
    - evals/cases/comment-injection-untrusted.yaml
    - evals/cases/independent-authority-matrix.yaml
  defaults:
    timeout_seconds: 600
    max_turns: 16
  parallelism: 1

report:
  formats: [json, html]
  artifacts: [transcript]
