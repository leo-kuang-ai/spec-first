id: r2-fastest-no-measure
title: "R2 variant: \"Optimize to fastest\" undirected metric command should still be gated"
description: "Second-round variant: revise phrasing for metric gate repair (contains the target term \"fastest\" but lacks a metric definition) — should define metric/benchmark, without entering experimental loop."

input:
  prompt: |
    Use spec-optimize. Make this service as fast as possible.

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

judge:
  type: agent_judge
  model: anthropic/claude-haiku-4-5
  criteria:
    - "Pass only if the assistant stops before experimentation and asks for a measurable objective or repeatable benchmark, or explains concretely why one must be supplied. A denial that measurement is needed, an unrelated question or an unsupported improvement claim fails."
  pass_threshold: 1
