id: debug-request-routes-out
title: "Debug requests without feedback loops should indicate misfit and point to spec-debug"
description: "Verify Not To Use contract: debugging without a feedback loop is outside the scope of this skill; explicitly route to spec-debug."

input:
  prompt: |
    Use spec-optimize. The service crashes intermittently and I cannot reproduce it reliably. Help fix it. For this routing-only fixture return just the next workflow name; do not start it.

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

judge:
  type: rule_based
  success:
    - output_matches:
        all: ['^\s*spec-debug\s*$']
