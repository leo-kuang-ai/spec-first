id: empty-input-asks
title: "Empty input should prompt inquiry into the optimization objective"
description: "Verify Input gate: When no input is provided, prompt \"What would you like to optimize / specify path?\""

input:
  prompt: |
    Use spec-optimize.

judge:
  type: agent_judge
  model: anthropic/claude-haiku-4-5
  criteria:
    - "Pass only if a user-facing request or question tool elicits the optimization target or its spec before starting an experiment. A focused imperative counts; merely mentioning a target, quoting a question, or denying the need for input does not."
  pass_threshold: 1
