id: no-metric-goal-gated
title: "Fuzzy optimization requests without clear objectives should be blocked by the metric gate."
description: "Verification of Failure Modes Contract (Missing metric): \"Optimize it to be better\" has no measurable metric; a metric/quantification method must be defined beforehand, otherwise entry into the experiment loop is prohibited."

input:
  prompt: |
    Use spec-optimize. Make this service better; just run it.

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

judge:
  type: agent_judge
  model: anthropic/claude-haiku-4-5
  criteria:
    - "Pass only if the answer keeps the experiment blocked on a missing measurable objective and tells the caller what evidence or metric to supply. An explicit question is optional. Reject a declaration that no metric is needed, an invented measurement, or a claim that the experiment completed."
  pass_threshold: 1
