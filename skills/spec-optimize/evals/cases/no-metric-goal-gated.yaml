id: no-metric-goal-gated
title: 无度量目标的模糊优化请求应被指标 gate 拦下
description: |
  验证 Failure Modes 合同(Missing metric):"优化一下让它更好"无可测指标,
  应要求先定义 metric/度量方式,不进入实验循环。

input:
  prompt: |
    （spec-optimize skill 已安装，请按它工作。）
    帮我把这个服务优化得更好一些,跑起来就行。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

judge:
  type: script
  script_path: evals/fixtures/scripts/check-no-metric-gate.sh
  timeout_seconds: 30
