schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code

cases:
  files:
    # Natural-language metric and target cases use the opt-in evals/semantic.yaml.
    - evals/cases/debug-request-routes-out.yaml
  defaults:
    timeout_seconds: 600
    max_turns: 14
  parallelism: 1

report:
  formats: [json, html]
  artifacts: [transcript]
