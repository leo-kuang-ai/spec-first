id: report-only-detects-tenant-bypass
title: "Default auditing should detect cross-tenancy authorization bypasses and enforce read-only access."
description: "Verify that Skill can identify resource ownership validation when resources are deleted, providing file-level evidence and an executable fix; gracefully downgrade when worker dispatch authorization is unavailable, and refrain from modifying the reviewed files."

input:
  prompt: |
    这是一个隔离评测工作区。先运行 `bash prepare-review-fixture.sh` 建立 baseline commit 并应用待审查补丁；
    该命令仅用于准备评测环境，不属于审查修复。
    请使用 spec-code-review 审查当前工作区相对 base:HEAD 的改动。
    只需要审查报告，不要修改文件、提交、切换分支，也不要调用子代理或并行 reviewer。

context:
  repo_fixture: evals/fixtures/repos/tenant-orders
  git:
    init: true
    checkout: main

judge:
  type: script
  script_path: evals/fixtures/scripts/check-report-only-tenant-bypass.sh
  timeout_seconds: 30
constraints:
  timeout_seconds: 900
