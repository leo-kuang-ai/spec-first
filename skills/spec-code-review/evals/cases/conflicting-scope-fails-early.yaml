id: conflicting-scope-fails-early
title: "The conflict scope parameter must fail before review."
description: "Verification base: When both the base and branch target are present, mode:agent returns a single failure JSON, does not proceed with the review, does not generate findings, and does not modify the workspace."

input:
  prompt: |
    请使用 spec-code-review 执行 mode:agent base:HEAD feature/other-branch 审查。
    不要调用子代理。最终只返回该 Skill 规定的机器可消费结果。

context:
  repo_fixture: evals/fixtures/repos/tenant-orders
  git:
    init: true
    checkout: main

judge:
  type: script
  script_path: evals/fixtures/scripts/check-conflicting-scope.sh
  timeout_seconds: 30
