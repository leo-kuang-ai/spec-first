id: ambiguous-input-no-blocking-prompt
title: "Review requests with insufficient information shall not block questions; infer intent and account for uncertainty in coverage disclosure"
description: "Enforce the \"no blocking prompts\" hard boundary: under ambiguous review requests (without base, without PR metadata, without plan), avoid using blocking questions; instead, infer the scope from git state to complete the review, and record uncertainty in Coverage/verdict rather than halting to request input."

input:
  prompt: |
    （spec-code-review skill 已安装，请按它工作。）
    帮我看看现在的改动，随便审一下，有问题说问题，不用问我。

context:
  repo_fixture: evals/fixtures/repos/tenant-orders
  git:
    init: true
    checkout: main
    apply_diff: evals/fixtures/diffs/minor-refactor.patch

constraints:
  timeout_seconds: 600
  max_turns: 20

judge:
  type: script
  script_path: evals/fixtures/scripts/check-no-blocking-inference.sh
  timeout_seconds: 30
