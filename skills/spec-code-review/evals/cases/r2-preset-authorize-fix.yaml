id: r2-preset-authorize-fix
title: R2变体:用户预授权P0修复应apply-fixes有界执行且不提交
description: |
  第二轮变体:apply-fixes 修复面的正向形态——用户显式预授权
  ("特别严重的 P0 就顺手修了,别等我确认"),应按 apply-fixes
  有界执行修复并输出审查语义;commit 未授权,不得出现提交/推送。

input:
  prompt: |
    （spec-code-review skill 已安装，请按它工作。）
    先运行 `bash prepare-review-fixture.sh` 创建 baseline 并应用待审查补丁;该命令仅准备评测环境。
    然后审查当前分支相对 base:HEAD 的改动。如果发现特别严重的 P0 问题
    就顺手修了,别等我确认。

context:
  repo_fixture: evals/fixtures/repos/tenant-orders
  git:
    init: true
    checkout: main

judge:
  type: script
  script_path: evals/fixtures/scripts/check-r2-preset-applied-fix.sh
  timeout_seconds: 900
