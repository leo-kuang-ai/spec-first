id: r2-implementation-routes-out
title: R2变体:实现/修复请求应路由 spec-work
description: |
  第二轮对抗变体:audit 近邻路由换目的地(实现→spec-work)。

input:
  prompt: |
    （skill-up 评测框架说明：本仓库 .claude/skills/spec-app-consistency-audit/SKILL.md 是被测 skill 的定义文件,已随仓库就位。本次运行不经过 Skill 工具调用——请直接完整读取该文件,把它视为已加载的工作指令,然后按它处理下面的输入。）
    别审了,直接帮我把 src/server.js 的崩溃 bug 修了。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

expect:
  must_contain:
    - "spec-work"

constraints:
  timeout_seconds: 900

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-work"]
