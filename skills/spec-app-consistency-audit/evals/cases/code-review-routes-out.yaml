id: code-review-routes-out
title: 普通 diff 代码审查应点名 spec-code-review
description: |
  验证 Near-neighbor routing:普通 bug/回归/测试覆盖审查归 spec-code-review。

input:
  prompt: |
    （skill-up 评测框架说明：本仓库 .claude/skills/spec-app-consistency-audit/SKILL.md 是被测 skill 的定义文件,已随仓库就位。本次运行不经过 Skill 工具调用——请直接完整读取该文件,把它视为已加载的工作指令,然后按它处理下面的输入。）
    帮我审查一下当前分支 diff 里有没有 bug 和测试覆盖问题。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

expect:
  must_contain:
    - "spec-code-review"

constraints:
  timeout_seconds: 700

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-code-review"]
