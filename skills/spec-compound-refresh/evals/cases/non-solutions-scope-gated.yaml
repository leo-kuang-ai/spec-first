id: non-solutions-scope-gated
title: Classify a source refactor with no knowledge maintenance request
description: This fixture checks the scope choice only, not filesystem changes or natural routing.

input:
  prompt: |
    I want to refactor this application's source code. I am not asking to maintain a learning or a glossary.
    Would spec-compound-refresh handle this request? Choose one label: refresh-in-scope or outside-refresh-scope.
    Return only the selected label. Do not perform the refactor or edit any files.

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

judge:
  type: rule_based
  success:
    - output_matches:
        all: ['^\s*outside-refresh-scope\s*$']
