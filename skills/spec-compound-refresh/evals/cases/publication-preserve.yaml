id: publication-preserve
title: "Only offline knowledge and actual citations prevent accidental deletion"
input:
  prompt: |
    First run node prepare-eval.cjs to establish the isolated fixture baseline. This does not authorize a task commit.
    Use spec-compound-refresh to decide whether docs/solutions/new.md can replace docs/solutions/old.md and the old file can be deleted.
    Review only. Do not edit files. Check the source, content unique to the old document, and the inbound catalog reference.
    Return JSON only: status, changed, deleted, decision (retain or delete), unique_section (path#heading of the old document's unique section), and inbound_from (path of the file that relies on it). Use repository-relative paths. The two change arrays record only this run's actual changes and deletions.
context:
  repo_fixture: evals/fixtures/repos/publication-safety
  git:
    init: true
    checkout: main
judge:
  type: script
  script_path: evals/fixtures/scripts/check-publication-preserve.sh
  timeout_seconds: 30
