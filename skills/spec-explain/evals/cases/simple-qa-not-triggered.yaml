id: simple-qa-not-triggered
title: "Ordinary Q&A should not trigger deep teaching artifact"
description: "Counterexample for description: ordinary Q&A does not constitute a durable teaching artifact—questions that can be answered in one sentence should be answered directly, without generating teaching documents."

input:
  prompt: |
    （spec-explain skill 已安装，请按它工作。）
    Node 的 stream 和 buffer 有什么区别?简单说说就行。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

expect:
  files_not_exist:
    - ".spec-first/workflows/spec-explain"
    - "docs/explainers"

judge:
  type: script
  script_path: evals/fixtures/scripts/check-simple-qa.sh
  timeout_seconds: 30
