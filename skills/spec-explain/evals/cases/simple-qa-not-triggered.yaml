id: simple-qa-not-triggered
title: "Ordinary Q&A should not trigger deep teaching artifact"
description: Check for a nonblank reply and absence of teaching artifacts in the fixture. Answer accuracy is assessed separately.

input:
  prompt: |
    With spec-explain available, what's the difference between a Node.js stream and a buffer? Keep it brief.

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

expect:
  files_not_exist:
    - ".spec-first/workflows/spec-explain"
    - "docs/explainers"

judge:
  type: script
  script_path: evals/fixtures/scripts/check-simple-qa.sh
  timeout_seconds: 30
