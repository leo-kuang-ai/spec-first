id: diagnose-then-choice-gate
title: 诊断后应呈现因果链并走 fix-choice gate
description: |
  验证 Phase 2 合同:真实可复现 bug(非法 JSON 使进程崩溃)应先复现定位、
  呈现完整因果链,再以选择问题(Fix it now / Diagnosis only / 重新设计)
  交给用户;单轮正确形态 = 诊断 + 询问,文件未被修(硬断言)。

input:
  prompt: |
    （spec-debug skill 已安装，请按它工作。）
    这个记账服务有个 bug:给 POST /entries 发一段非法 JSON,整个 node 进程
    直接崩掉退出,后面的请求全挂。帮我查。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

judge:
  type: script
  script_path: evals/fixtures/scripts/check-diagnosis-no-fix.sh
  timeout_seconds: 30
