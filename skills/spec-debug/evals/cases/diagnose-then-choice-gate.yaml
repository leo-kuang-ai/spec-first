id: diagnose-then-choice-gate
title: Diagnosis-only requests deliver the causal chain without changing source
description: |
  Verify the Phase 2 contract: reproduce the invalid-JSON process crash,
  identify its cause, and present the causal chain. A diagnosis-only request must
  preserve source; a follow-up repair menu is not required for completion.
  Retain the historical case ID and distinguish revisions by versioned inputs.

input:
  prompt: |
    First run `node prepare-eval.cjs` once in this isolated fixture.
    Only preparation may create a baseline commit; it grants no task commit or landing authority.
    （spec-debug skill 已安装，请按它工作。）
    这个记账服务有个 bug:给 POST /entries 发一段非法 JSON,整个 node 进程
    直接崩掉退出,后面的请求全挂。帮我查。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

constraints:
  timeout_seconds: 900
  max_turns: 40

judge:
  type: script
  script_path: evals/fixtures/scripts/check-diagnosis-no-fix.sh
  timeout_seconds: 30
