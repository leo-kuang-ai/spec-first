id: prior-attempt-asks-first
title: Ask for prior attempts before starting a new investigation
description: |
  Accept Unicode question marks and inspect runner call order for known
  investigation and mutation operations. Semantic adequacy needs separate review.
input:
  prompt: |
    Use the installed spec-debug skill. The service will not start. I have tried several fixes without success. Help me diagnose it.
context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main
judge:
  type: script
  script_path: evals/fixtures/scripts/check-prior-attempt-ask.sh
  timeout_seconds: 30
