schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code

cases:
  files:
    - evals/cases/check-readonly.yaml
    - evals/cases/semantic-question-not-setup.yaml
    - evals/cases/bare-invocation-fail-closed-on-unverified-surface.yaml
  defaults:
    timeout_seconds: 600
    max_turns: 20
  parallelism: 1

report:
  formats: [json, html]
  artifacts: [transcript]
