id: check-readonly
title: "check keep fixture and configuration read-only"
description: "--check is a read-only diagnosis; --verify-only allows writing of setup-owned facts but is not applicable for this use case. Judge verifies fixed fixture bytes, the sentinel values of two host configurations, and confirms that the setup facts directory has not been generated. This check does not cover user-level configurations, external installations, write-before-restore scenarios, or actual host blocking; therefore, global side effects cannot be declared absent based on this check."

input:
  prompt: |
    Use the installed spec-runtime-setup skill to check this project's runtime readiness.
    Do not install tools, change host configuration, write facts, or substitute --verify-only.
    From the fixture directory, run node "<loaded skill directory>/scripts/setup.cjs" --check --json
    directly in Bash, using the actual path without pipes or redirection. Use read tools for path discovery.

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main
  files:
    ".claude/settings.json": |
      {}
    ".mcp.json": |
      {}

judge:
  type: script
  script_path: evals/fixtures/scripts/check-readonly-verify.sh
  timeout_seconds: 30
