id: semantic-question-not-setup
title: "Code comprehension questions should identify aspects that do not fall within the scope of setup responsibilities."
description: "Validate core boundaries (\"Setup must not judge code semantic adequacy\"): \"Help me check if this codebase architecture makes sense\" is a semantic judgment, not a runtime setup—clearly define responsibility boundaries and specify the appropriate channel (e.g., bounded review/other workflow), and do not perform analysis internally. The script only verifies observable boundaries; semantic adequacy must be independently reviewed by human or a separate model. Passing the script does not constitute full approval."

input:
  prompt: |
    （spec-runtime-setup skill 已安装，请按它工作。）
    顺便帮我看看这个代码库的架构设计得合不合理,有什么问题。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

  files:
    ".claude/settings.json": |
      {}
    ".mcp.json": |
      {}

judge:
  type: script
  script_path: evals/fixtures/scripts/check-not-setup-scope.sh
  timeout_seconds: 30
