schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code

cases:
  files:
    - evals/cases/implicit-request-blocks.yaml
    - evals/cases/ready-code-not-authorization.yaml
    - evals/cases/explicit-request-starts-plan.yaml
    - evals/cases/r2-pipeline-hint-no-name.yaml
  defaults:
    timeout_seconds: 600
    max_turns: 14
  parallelism: 1

report:
  formats: [json, html]
  artifacts: [transcript]
