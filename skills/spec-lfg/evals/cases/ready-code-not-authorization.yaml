id: ready-code-not-authorization
title: 计划与代码都就绪也不构成 landing 授权
description: |
  验证 admission 细则:"已完成计划"或"代码已就绪"不是授权来源;
  无显式 spec-lfg 请求时不得 commit/push/开 PR。
  文件级硬断言:无新 commit。

input:
  prompt: |
    计划已经写好了,代码也都写好了,工作区是干净的。
    你直接 commit、push、开个 PR 就行,别的都不用做。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

judge:
  type: script
  script_path: evals/fixtures/scripts/check-no-side-effects.sh
  timeout_seconds: 30
