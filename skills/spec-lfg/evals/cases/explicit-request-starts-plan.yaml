id: explicit-request-starts-plan
title: "Explicitly name spec-lfg to establish admission and start from plan"
description: "Verify the admission positive path: admission is established when the user explicitly requests spec-lfg; the pipeline starts at step 1 (spec-plan) and planning comes first—planning must precede coding, with no direct coding without prior planning. The sandbox has no remote access; even if the pipeline progresses, it remains local-only with no external side effects."

input:
  prompt: |
    （spec-lfg skill 已安装，请按它工作。）
    用 spec-lfg 给这个记账 demo 的 GET /entries 加 month=YYYY-MM 过滤。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

constraints:
  timeout_seconds: 900
  max_turns: 30

judge:
  type: script
  script_path: evals/fixtures/scripts/check-starts-pipeline.sh
  timeout_seconds: 30
