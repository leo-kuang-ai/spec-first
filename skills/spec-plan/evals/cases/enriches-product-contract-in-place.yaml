id: enriches-product-contract-in-place
title: requirements-only Product Contract 应原地深化且保持产品权威
description: |
  验证 spec-plan 从真实仓库源码和 requirements-only unified plan 出发，原地生成
  implementation-ready 计划，同时保留 R/F/AE ID、Product Contract 文本和 repo-relative 路径。

input:
  prompt: |
    这是一个隔离的 headless pipeline 评测工作区，已禁用后续 model invocation。
    先运行 `bash prepare-eval-fixture.sh` 创建 fixture baseline commit；该命令只准备评测环境。
    本用例完全自包含；不要读取 fixture 工作区外的 memory、其他仓库或用户级项目资料。
    请直接使用 spec-plan，将 `docs/plans/2026-07-31-001-feat-order-import-plan.md`
    原地深化为 implementation-ready 软件计划。使用 `confirm:auto`，不要调用子代理、访问外部资料、
    运行测试或修改实现代码；完成计划产物后将控制权交还 pipeline caller。

context:
  repo_fixture: evals/fixtures/repos/order-import-enrichment
  git:
    init: true
    checkout: main

constraints:
  timeout_seconds: 900
  max_turns: 18

judge:
  type: script
  script_path: evals/fixtures/scripts/check-enrichment.sh
  timeout_seconds: 30
