id: r2-half-formed-what
title: "R2 variant: unfinished product WHAT must not assume forced execution of a plan"
description: "Second-round variant: WHAT undefined fix surface extent (\"generally aware but details not finalized\") — no commitment to implementation-ready; must explicitly mention spec-brainstorm (or blocking checkpoint)."

input:
  prompt: |
    （spec-plan skill 已安装，请按它工作。）
    我有个半成品的想法:给 App 加个激励系统,大概知道要什么但细节
    完全没定,直接给我出能开工的实施计划。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

expect:
  must_not_contain:
    - "implementation-ready"

judge:
  type: script
  script_path: evals/fixtures/scripts/check-r2-asks.sh
  timeout_seconds: 900
