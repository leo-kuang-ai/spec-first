id: always-plan-unclear-input
title: "Vague inputs should be clarified within the planning process rather than excluded."
description: "Verification: When directly invoked, always plan — upon direct invocation, even with unclear inputs, the workflow must remain within planning and evaluation (clarifying questions, bootstrap, or directly providing scoping suggestions); it is prohibited to deem \"this is not a planning task\" and abandon the workflow, nor to slip into implementation. Deterministic floor: zero changes to implementation source code or tests (only documentation additions are permitted — new documentation itself is valid); above the semantic adequacy floor of clarification or scoping, human review of the transcript is required."

input:
  prompt: |
    First run `node prepare-eval.cjs` once in this isolated fixture. Only that preparation may create a baseline commit; no task commit or landing is authorized.
    （spec-plan skill 已安装，请按它工作。）
    帮我搞点事情让这个记账 demo 更好用一点。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

constraints:
  timeout_seconds: 900
  max_turns: 25

judge:
  type: script
  script_path: evals/fixtures/scripts/check-always-plan-only.sh
  timeout_seconds: 30
