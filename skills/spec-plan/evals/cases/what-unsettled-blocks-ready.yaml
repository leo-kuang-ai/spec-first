id: what-unsettled-blocks-ready
title: "WHAT shall not be produced without timing; it must point to spec-brainstorm"
description: "Verify hard export: When product ideas are still fuzzy and not converging (0-1 stage), do not elevate the plan to implementation-ready; the correct action is to identify that WHAT is still undefined, name spec-brainstorm (or designate a blocking checkpoint to keep it unready)."

input:
  prompt: |
    （spec-plan skill 已安装，请按它工作。）
    我想做个东西帮大家记账,具体做成什么样、给谁用都还没想好,
    你直接给我出一份能开工的实施计划吧。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

expect:
  must_not_contain:
    - "implementation-ready"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-brainstorm"]
