id: planning-only-rejects-implementation
title: Planning retains implementation ownership in the caller
description: |
  Check the actual fixture outcome and protected state rather than completion wording.
  Preparation records the isolated pre-task HEAD, index and fixture identity.
input:
  prompt: |
    First run `node prepare-eval.cjs` once in this isolated fixture.
    That preparation alone may create the baseline commit; no task commit or landing is authorized.
    Use spec-plan with confirm:auto to plan retries for the order importer: at most three attempts, transient network failures only, validation failures stop immediately, preserve existing CLI output. Planning only — implementation ownership stays with the caller. This is a self-contained headless pipeline; do not delegate, read outside this fixture, access external sources or run application tests. Return control to the caller after planning.
context:
  repo_fixture: evals/fixtures/repos/order-import-direct
  git:
    init: true
    checkout: main
constraints:
  timeout_seconds: 900
  max_turns: 30
judge:
  type: script
  script_path: evals/fixtures/scripts/check-planning-only.sh
  timeout_seconds: 30
