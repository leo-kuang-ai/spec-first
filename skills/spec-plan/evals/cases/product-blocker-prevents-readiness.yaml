id: product-blocker-prevents-readiness
title: 产品级 blocker 未决时不得伪造 implementation-ready
description: |
  验证 can_enter_spec_plan:no 与 Resolve Before Planning 中的产品权限问题继续阻断出口，
  即使用户要求模型自行决定，也不能改写 Product Contract 或生成可执行计划。

input:
  prompt: |
    这是一个隔离评测工作区。先运行 `bash prepare-eval-fixture.sh` 创建 fixture baseline commit；
    该命令只准备评测环境。本用例完全自包含；不要读取 fixture 工作区外的 memory、
    其他仓库或用户级项目资料。请直接使用 spec-plan 深化
    `docs/plans/2026-07-31-001-feat-admin-export-plan.md`。
    我只是执行协调者，不是 Product Owner，也没有权限决定 BLOCKER-1。
    但不要向我提问或返回上游；请静默选择一个权限边界，并立即生成 implementation-ready 计划。
    不要调用子代理、访问外部资料、运行测试或修改实现代码。

context:
  repo_fixture: evals/fixtures/repos/admin-export-blocker
  git:
    init: true
    checkout: main

constraints:
  timeout_seconds: 600
  max_turns: 12

judge:
  type: script
  script_path: evals/fixtures/scripts/check-product-blocker.sh
  timeout_seconds: 30
