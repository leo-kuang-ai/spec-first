id: dispatch-classic-mode
title: Metric/Verify 输入应分发 classic 模式并打印 banner
description: |
  验证 Dispatch 表第一行:输入携带 Metric:/Verify: 时进入 Classic
  metric loop(非 Orchestrator),且按规程打印 mode banner。

# 该例在 live 实测中跑完 3 次迭代约 340s，超过 cases.defaults 的 300s；
# case 顶层的 timeout_seconds 会被静默忽略，必须写在 constraints 下。
constraints:
  timeout_seconds: 900

input:
  prompt: |
    （skill-up 评测框架说明：本仓库 .claude/skills/autoresearch/SKILL.md 是被测
    skill 的定义文件,已随仓库就位。本次运行不经过 Skill 工具调用——请先 diff 该文件
    与 source 真相源 skills/autoresearch/SKILL.md；不一致时以 source 为准并在开头
    报告一行 `tested_definition: <runtime-mirror|source>`。然后完整读取被测定义,
    把它视为已加载的工作指令,按它处理下面的输入。）
    Metric: passing test count
    Verify: npm test --silent 2>&1 | tail -5
    Iterations: 3
    把通过测试数提上去。

context:
  repo_fixture: evals/fixtures/repos/empty-repo
  git:
    init: true
    checkout: main

judge:
  type: script
  script_path: evals/fixtures/scripts/check-classic-banner.sh
  timeout_seconds: 30
