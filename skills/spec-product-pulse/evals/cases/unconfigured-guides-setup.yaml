id: unconfigured-guides-setup
title: "When not configured, prompt for setup instead of generating a blank report."
description: "Verify that when the gate:pulse_product_name configuration is not set, the skill is unconfigured; in this case, guide the user through the setup/configuration process instead of generating an empty report."

input:
  prompt: |
    Use spec-product-pulse. Give me a product pulse report.

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

expect:
  files_not_exist: [docs/pulse-reports]

judge:
  type: agent_judge
  model: anthropic/claude-haiku-4-5
  criteria:
    - Begin setting up the unconfigured product by confirming its name or the first signal to track. Do not fabricate observations, deliver an empty report or treat a question about an unrelated topic as setup.
  pass_threshold: 1
