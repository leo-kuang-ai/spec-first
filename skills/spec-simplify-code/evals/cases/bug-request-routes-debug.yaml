id: bug-request-routes-debug
title: "bug request should be routed to spec-debug"
description: "Verify description routing: \"use spec-debug for bugs\" — for requests exhibiting failure symptoms, trace should point to spec-debug rather than the simplified path."

input:
  prompt: |
    （spec-simplify-code skill 已安装，请按它工作。）
    服务发非法 JSON 会崩,帮我处理一下。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

expect:
  must_contain:
    - "spec-debug"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-debug"]
