id: docs-only-no-yield
title: A docs-only scope has no code simplification yield
description: |
  Check the actual fixture outcome and protected state rather than completion wording.
  Preparation records the isolated pre-task HEAD, index and fixture identity.
input:
  prompt: |
    First run `node prepare-eval.cjs` once in this isolated fixture.
    That preparation alone may create the baseline commit; no task commit or landing is authorized.
    Use spec-simplify-code to simplify docs/notes.md.
context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main
constraints:
  timeout_seconds: 900
  max_turns: 30
judge:
  type: script
  script_path: evals/fixtures/scripts/check-no-yield-scope.sh
  timeout_seconds: 30
