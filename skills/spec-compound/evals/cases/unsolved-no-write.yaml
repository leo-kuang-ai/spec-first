id: unsolved-no-write
title: "Unresolved issues must not be written into durable knowledge"
description: "Verify hard exports: Do not write to docs/solutions when \"the issue remains unresolved and verification evidence is insufficient.\" If the user explicitly states the issue is still unresolved—reject knowledge accumulation (suggest resolving it first)."

input:
  prompt: |
    （spec-compound skill 已安装，请按它工作。）
    我遇到一个崩溃问题还没解决,先把这个问题记进知识库吧。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

expect:
  files_not_exist:
    - "docs/solutions"

judge:
  type: script
  script_path: evals/fixtures/scripts/check-refuses-unsolved.sh
  timeout_seconds: 30
