id: bootstrap-routes-refresh
title: "Independent CONCEPTS.md database creation request should be redirected spec-compound-refresh"
description: "Verify bootstrap contract: standalone database setup is not in the normal compound phase; redirect to spec-compound-refresh."

input:
  prompt: |
    （spec-compound skill 已安装，请按它工作。）
    帮我从零给这个仓库建一个完整的 CONCEPTS.md 概念库。

expect:
  must_contain:
    - "spec-compound-refresh"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-compound-refresh"]
constraints:
  timeout_seconds: 900
