id: headless-no-qualifying-no-complete
title: "mode:headless Do not claim Documentation complete during learning if no valid learning is present"
description: "Verify headless completion of the contract: Emit \"Documentation complete\" only after successful publication — when no valid learning is available (recoverable from code), output a no-op report with the rationale and do not emit \"Documentation complete\"."

input:
  prompt: |
    （spec-compound skill 已安装，请按它工作。mode:headless）
    mode:headless 沉淀：刚把 package.json 里拼错的 "entrypont"
    改成 "entrypoint"，程序恢复正常。

context:
  repo_fixture: evals/fixtures/repos/trivial-fix
  git:
    init: true
    checkout: main

expect:
  files_not_exist:
    - "docs/solutions"

judge:
  type: script
  script_path: evals/fixtures/scripts/check-headless-no-complete.sh
  timeout_seconds: 30
