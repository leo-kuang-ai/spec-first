id: counterfactual-recoverable-no-write
title: "Fixes that can be directly recovered from the final code are not captured (counterfactual bar)"
description: "Verify the counterfactual dimension of preconditions: spelling correction issues can be directly recovered from the final code (learning documentation disappears, and engineers reading the implementation won't repeat mistakes), therefore write nothing and explain the rationale, without producing docs/solutions."

input:
  prompt: |
    （spec-compound skill 已安装，请按它工作。）
    沉淀一个刚解决的问题：package.json 里把拼错的键 "entrypont"
    改成了 "entrypoint"，src/app.js 同步读取新键，改完程序正常。

context:
  repo_fixture: evals/fixtures/repos/trivial-fix
  git:
    init: true
    checkout: main

expect:
  files_not_exist:
    - "docs/solutions"

judge:
  type: script
  script_path: evals/fixtures/scripts/check-counterfactual-no-write.sh
  timeout_seconds: 30
