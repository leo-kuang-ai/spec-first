id: design-question-not-verdict
title: "Open design issues (user-defined options) are not within POV's jurisdiction."
description: "Verify verdict shape of contract: POV is responsible only for \"deciding whether to adopt externally named candidates\"; user-designed open questions (\"How should I design this feature?\") should explicitly fall outside the POV's responsibility and point to spec-brainstorm/spec-plan."

input:
  prompt: |
    Use spec-pov. Should my ledger put the form and list on one page or two? I have not settled which user need the layout must serve. Return only the name of the workflow that should own the next step. Do not start it.

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

judge:
  type: rule_based
  success:
    - output_matches:
        all: ['^\s*spec-brainstorm\s*$']
