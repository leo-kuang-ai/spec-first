id: r2-real-verdict-works
title: "R2 Positive: True external candidate rulings should normally produce a verdict."
description: "Second round of positive variant: Verify design-question fix does not overly tighten — MySQL → PostgreSQL involves named external candidates + whether-to-commit; should normally reach a verdict (for comparison, not rejection, not routing to brainstorm)."

input:
  prompt: |
    Run `node prepare-eval.cjs` once to capture the isolated fixture. Only preparation may make a baseline commit. Use spec-pov: should this ledger move from MySQL to PostgreSQL? Work offline from the supplied project and owner note; external calls and changes are not authorized. Return JSON with decision (adopt, trial, retain or defer), current_storage (mysql, postgres, memory or unknown), source (the relative code path establishing that storage), rationale, and reconsider_when. Make the tradeoff and the missing evidence clear.

context:
  repo_fixture: evals/fixtures/repos/mysql-ledger
  git:
    init: true
    checkout: main

expect:
  must_not_contain:
    - "spec-brainstorm"

judge:
  type: script
  script_path: evals/fixtures/scripts/check-r2-verdict-given.sh
  timeout_seconds: 900
