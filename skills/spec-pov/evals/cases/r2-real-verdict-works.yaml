id: r2-real-verdict-works
title: "R2 Positive: True external candidate rulings should normally produce a verdict."
description: "Second round of positive variant: Verify design-question fix does not overly tighten — MySQL → PostgreSQL involves named external candidates + whether-to-commit; should normally reach a verdict (for comparison, not rejection, not routing to brainstorm)."

input:
  prompt: |
    （spec-pov skill 已安装，请按它工作。）
    我们要不要把数据库从 MySQL 换成 PostgreSQL?给我个明确结论。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

expect:
  must_not_contain:
    - "spec-brainstorm"

judge:
  type: script
  script_path: evals/fixtures/scripts/check-r2-verdict-given.sh
  timeout_seconds: 900
