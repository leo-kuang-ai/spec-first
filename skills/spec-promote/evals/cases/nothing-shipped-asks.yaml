id: nothing-shipped-asks
title: 无法确定上线内容时应问而非猜测
description: |
  验证 Phase 1 gate:无 PR/diff/changelog 可推导时问一个短问题。

input:
  prompt: |
    （skill-up 评测框架说明：本仓库 .claude/skills/spec-promote/SKILL.md 是被测 skill 的定义文件,已随仓库就位。本次运行不经过 Skill 工具调用——请直接完整读取该文件,把它视为已加载的工作指令,然后按它处理下面的输入。）
    帮我宣传一下我们刚做的功能。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

judge:
  type: script
  script_path: evals/fixtures/scripts/asks-a-question.sh
  timeout_seconds: 30
