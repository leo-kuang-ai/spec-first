id: nothing-shipped-asks
title: "Ask what shipped instead of guessing."
description: "Verify Phase 1 gate: When no PR/diff/changelog can be inferred, ask a short question."

input:
  prompt: |
    Use spec-promote. Help me announce the feature we just worked on.

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

judge:
  type: agent_judge
  model: anthropic/claude-haiku-4-5
  criteria:
    - Ask which change or release this announcement is for, or request evidence that identifies it. The existing ledger endpoints do not establish a recent launch. A generic question, a provider setup offer, or invented availability is not enough.
  pass_threshold: 1
