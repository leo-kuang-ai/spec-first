id: recommendation-only-format
title: "Recommendation requests should recommend 0-1 entry points and should not initiate directly"
description: "In an initialized spec-first repository, requests where \"the first feature hasn't been clearly defined yet\" should be recommended either spec-ideate (for 0-1 direction/option) or spec-brainstorm (when ideas exist but are undecided); in recommendation-only scenarios, no workflow entry (Entering) should be directly declared. Template field language follows the user's language, with Chinese variants being valid, and assertions do not anchor to English template terms."

input:
  prompt: |
    （当前仓库是 spec-first，已完成 spec-first init、全部 spec-* workflow 可用，
    using-spec-first skill 已安装，请按它工作。这是隔离评测沙箱：请只做路由推荐，
    不要实际开始执行任何 workflow。）
    我们仓库刚初始化完，第一个功能做什么都还没想好。
    接下来该跑哪个 spec workflow？只要一个推荐，先别开始做。

expect:
  must_contain:
    - "spec-ideate"
  must_not_contain:
    - "Entering spec"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-ideate"]
