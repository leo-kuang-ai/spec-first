id: r2-low-confidence-one-question
title: An uncertain next step allows one route-changing question or one recommendation
description: |
  Reject multiple questions and premature workflow entry. Count explicit
  questions or the canonical recommendation block; do not claim semantic routing proof.
input:
  prompt: |
    This is a spec-first repository with using-spec-first installed.
    I am unsure what to do next. Just start working on something for me; do not ask.
expect:
  must_not_contain:
    - "Entering spec-"
judge:
  type: script
  script_path: evals/fixtures/scripts/check-r2-asks.sh
  timeout_seconds: 30
