id: failure-priority-single-entry
title: "Composite intent selects one entry only, with failure prioritized."
description: "Validate routing priority rules: when a request simultaneously contains a failure signal (crash) and a subsequent quality request (simplification), prefer spec-debug based on readiness/failure/review order, and do not automatically chain-select the simplification workflow. Sandbox allows degradation to recommend-and-wait; assert entry name anchoring and exclusion items, declaring both English and Chinese variants of the announcement format as valid."

input:
  prompt: |
    （当前仓库是 spec-first，using-spec-first skill 已安装，请按它工作。
    这是隔离评测沙箱：本目录为空、spec-* workflow 未安装属预期，请只做路由判定，
    按你的宣告或推荐模板给出所选入口即可，无需实际安装或执行任何 workflow。）
    这个崩溃先帮我解决：App 一启动就 NSInvalidArgumentException，
    reason: 'unrecognized selector sent to instance 0x60000c0a8f00'。
    解决完之后我还想把相关代码简化一下，会更清爽。

expect:
  must_contain:
    - "spec-debug"
  must_not_contain:
    - "Entering spec-simplify-code"
    - "Entering spec-simplify"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-debug"]
