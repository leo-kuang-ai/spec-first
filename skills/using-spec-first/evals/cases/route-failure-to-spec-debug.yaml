id: route-failure-to-spec-debug
title: "Failure signals should be routed to spec-debug"
description: "Verify that the entrypoint governor selects exactly one entrypoint for error/stack/regression requests: it should select `spec-debug`, not `spec-plan` or `spec-work`, nor chain-enter multiple workflows. The sandbox is an empty directory, the workflow is not installed, and the skill allows degradation to output a recommended template via `recommend-and-wait`; thus, assertions only anchor on entrypoint name and excluded items, and all formats (Entering / Recommended entrypoint / Chinese variant) are considered valid."

input:
  prompt: |
    （当前仓库是 spec-first，using-spec-first skill 已安装，请按它工作。
    这是隔离评测沙箱：本目录为空、spec-* workflow 未安装属预期，请只做路由判定，
    按你的宣告或推荐模板给出所选入口即可，无需实际安装或执行任何 workflow。）
    跑 npm test 全挂了，报 TypeError: Cannot read properties of undefined (reading 'id')，
    位置 src/sum.js:42，昨天还是绿的。帮我处理一下。

expect:
  must_contain:
    - "spec-debug"
  must_not_contain:
    - "Entering spec-plan"
    - "Entering spec-work"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-debug"]
