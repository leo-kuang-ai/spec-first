id: direct-lane-simple-howto
title: "Lightweight one-time responses should remain in Direct Lane and not enter workflow."
description: "Validate the Direct Lane criterion: the lightweight facts/contextual knowledge or one-time how-to explanation in the current context does not trigger any spec-* workflow, generates no \"Entering\" declaration, and produces no route recommendation (Recommended entrypoint / recommended entry), and is directly answered by the entry governor."

input:
  prompt: |
    （当前仓库是 spec-first，using-spec-first skill 已安装，请按它工作。）
    Markdown 的围栏代码块语法是什么？一句话告诉我。

expect:
  must_not_contain:
    - "Entering spec"
    - "Recommended entrypoint"
    - "推荐入口"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["```"]
