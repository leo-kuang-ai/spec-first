id: route-vague-idea-to-spec-brainstorm
title: "Vague ideas should be routed to spec-brainstorm"
description: "Verify that the entry governor selects spec-brainstorm for the vague notion of \"problem definition/user/success criteria all undefined,\" rather than spec-plan (WHERE is defined but HOW is not) or spec-ideate (which requires 0-1 direction generation). The sandbox allows degradation to recommend-and-wait; assert that entry names and exclusions are anchored, and declare all English and Chinese variants in formatting are valid."

input:
  prompt: |
    （当前仓库是 spec-first，using-spec-first skill 已安装，请按它工作。
    这是隔离评测沙箱：本目录为空、spec-* workflow 未安装属预期，请只做路由判定，
    按你的宣告或推荐模板给出所选入口即可，无需实际安装或执行任何 workflow。）
    我有个模糊的念头：想给团队做个自动汇总每日站会进展的小工具，
    但不确定该做多大、给谁用、成功标准是什么。帮我理一理。

expect:
  must_contain:
    - "spec-brainstorm"
  must_not_contain:
    - "Entering spec-plan"
    - "Entering spec-ideate"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-brainstorm"]
