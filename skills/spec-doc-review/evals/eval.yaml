schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code

cases:
  files:
    - evals/skillup/cases/flag-conflict-fails-closed.yaml
    - evals/skillup/cases/headless-no-path-fails.yaml
    - evals/skillup/cases/default-report-only-no-write.yaml
    - evals/skillup/cases/task-pack-forces-report-only.yaml
    - evals/skillup/cases/html-forces-report-only.yaml
    - evals/skillup/cases/standard-roster-budget.yaml
  defaults:
    timeout_seconds: 600
    max_turns: 40
  parallelism: 1

report:
  formats: [json, html]
  artifacts: [transcript]
