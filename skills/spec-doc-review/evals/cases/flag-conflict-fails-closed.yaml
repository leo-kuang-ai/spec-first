id: flag-conflict-fails-closed
title: "Conflict mutation token should fail closed and not read documentation"
description: "Verify Phase 0 exact-token contract: multiple mutations: * if multiple tokens appear simultaneously, it constitutes a flag conflict; a fail closed must occur before reading documentation or dispatching a reviewer; return a fixed error and explicitly name the conflicting tokens; no prioritization may be guessed."

input:
  prompt: |
    （spec-doc-review skill 已安装，请按它工作。）
    mode:headless mutation:apply-fixes mutation:report-only docs/plans/2026-09-01-monthly-summary-plan.md

context:
  repo_fixture: evals/fixtures/repos/plan-repo
  git:
    init: true
    checkout: main

expect:
  must_contain:
    - "flag-conflict-or-unsupported"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["flag-conflict-or-unsupported"]
