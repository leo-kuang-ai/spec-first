id: headless-no-path-fails
title: headless 模式缺文档路径应返回固定错误不派发
description: |
  验证 Phase 1 headless gate:无文档路径时输出固定错误消息(含重新调用指引),
  不派发 personas、不猜测文档。断言接受 SKILL.md 契约原文或等价中文语义
  (固定回执禁止本地化,但断言不因语言漂移误杀)。

input:
  prompt: |
    （skill-up 评测框架说明：本仓库 .claude/skills/spec-doc-review/SKILL.md 是被测 skill 的定义文件,已随仓库就位。本次运行不经过 Skill 工具调用——请直接完整读取该文件,把它视为已加载的工作指令,然后按它处理下面的输入。）
    mode:headless

judge:
  type: script
  script_path: evals/skillup/fixtures/scripts/check-headless-no-path.sh
  timeout_seconds: 30
