schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code

cases:
  files:
    - evals/cases/empty-topic-asks.yaml
    - evals/cases/verdict-routes-to-pov.yaml
    - evals/cases/neither-direct-answer.yaml
    - evals/cases/non-software-universal.yaml
    - evals/cases/clear-req-writes-plan.yaml
    - evals/cases/r2-verdict-graphql.yaml
    - evals/cases/r2-normal-convergence-works.yaml
  defaults:
    timeout_seconds: 480
    max_turns: 12
  parallelism: 1

report:
  formats: [json, html]
  artifacts: [transcript]
