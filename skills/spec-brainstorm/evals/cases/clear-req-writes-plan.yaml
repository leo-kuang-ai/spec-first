id: clear-req-writes-plan
title: "Handle and commit requirements-only plans concisely when requirements are clear"
description: "Validate 0.2: Clear requirement path + Phase 3 contract output: Acceptance criteria are explicit, and scope is limited to isolated, single-point needs—no long-form divergent discussions should be triggered. When writing to disk based on user's explicit instructions, store in `docs/plans/` (default: Markdown), with filename following the format `YYYY-MM-DD-NNN-<type>-<topic>-plan`. The contract artifact frontmatter fields `requirements-only` or `spec-unified-plan/v1` must be written directly into the file, not in the chat output, and require manual verification."

input:
  prompt: |
    （spec-brainstorm skill 已安装，请按它工作。）
    我的需求很明确,不需要发散:给这个记账 demo 的 GET /entries 加一个可选参数
    month=YYYY-MM,只返回该月的条目;验收标准:不带参数返回全部,带参数只返回该月。
    请把它落成 requirements-only 的计划文档。

context:
  repo_fixture: evals/fixtures/repos/mini-ledger
  git:
    init: true
    checkout: main

constraints:
  timeout_seconds: 600
  max_turns: 40

expect:
  must_contain:
    - "docs/plans"
    - "-plan.md"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["docs/plans", "-plan.md"]
