id: r2-verdict-graphql
title: R2变体:REST→GraphQL 迁移裁决应路由 spec-pov
description: |
  第二轮对抗变体:verdict 修复面换技术域(REST→GraphQL)。

input:
  prompt: |
    （skill-up 评测框架说明：本仓库 .claude/skills/spec-brainstorm/SKILL.md 是被测 skill 的定义文件,已随仓库就位。本次运行不经过 Skill 工具调用——请直接完整读取该文件,把它视为已加载的工作指令,然后按它处理下面的输入。）
    我们在纠结要不要把 API 从 REST 迁到 GraphQL,你直接告诉我迁不迁。

expect:
  must_contain:
    - "spec-pov"

constraints:
  timeout_seconds: 900

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-pov"]
