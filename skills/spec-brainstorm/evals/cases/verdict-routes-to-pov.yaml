id: verdict-routes-to-pov
title: "The naming of external candidate adoption decisions should be interactively handed off to spec-pov"
description: "Verify the three essential elements of the 0.1c verdict gate (naming external candidates + commit intent + project-specific alignment): \"Should we replace ESLint with Biome?\" falls under a decision-request category and must follow interactive verdict-routing with an offer spec-PoV (no silent switching, no direct conclusion or brainstorming execution within the current workflow). Bare verdict issues must first be carved out into the Software domain and passed through the 0.1c gate; a shortcut to \"Neither\" is prohibited merely because the request mentions only a tool name."

input:
  prompt: |
    （skill-up 评测框架说明：本仓库 .claude/skills/spec-brainstorm/SKILL.md 是被测 skill 的定义文件,已随仓库就位。本次运行不经过 Skill 工具调用——请直接完整读取该文件,把它视为已加载的工作指令,然后按它处理下面的输入。）
    我们这个项目现在用 ESLint,要不要换成 Biome?帮我决定。

expect:
  must_contain:
    - "spec-pov"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["spec-pov"]
