id: non-software-universal
title: "Non-software topics should follow the universal approach and not develop a software plan."
description: "Verify 0.1b: Non-software category: Household celebration planning with no software signals; route to universal-brainstorming (Core Principles and Interaction Rules still apply: one question at a time), do not generate a spec-unified-plan software plan. Assert anchor point: \"question-based opening + no plan output\"; whether the universal reference is truly loaded is verified by transcript."

input:
  prompt: |
    （spec-brainstorm skill 已安装，请按它工作。）
    帮我想想怎么安排我爸妈的七十大寿庆典。

expect:
  files_not_exist:
    - "docs/plans"

judge:
  type: script
  script_path: evals/fixtures/scripts/asks-a-question.sh
  timeout_seconds: 30
