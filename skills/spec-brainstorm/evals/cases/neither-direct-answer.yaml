id: neither-direct-answer
title: "Quick facts should be answered directly without going through brainstorming."
description: "Verification 0.1b Neither category: a one-sentence factual question does not constitute a brainstorm need; skip the entire brainstorm phase and respond directly, without generating a plan or initiating exploratory dialogue."

input:
  prompt: |
    （spec-brainstorm skill 已安装，请按它工作。）
    git rebase 和 git merge 有什么区别?简短说明。

expect:
  must_contain:
    - "rebase"
  files_not_exist:
    - "docs/plans"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["rebase"]
