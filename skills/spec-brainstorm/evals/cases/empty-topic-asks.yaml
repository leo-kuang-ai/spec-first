id: empty-topic-asks
title: "Empty feature description should first raise questions without advancing."
description: "Verify Feature Description gate: When there is no theme in a call, prompt \"What would you like to explore?\" according to SKILL.md; no stage advancement or plan output shall proceed prior to receiving the feature description."

input:
  prompt: |
    （spec-brainstorm skill 已安装，请按它工作。）

expect:
  files_not_exist:
    - "docs/plans"

judge:
  type: script
  script_path: evals/fixtures/scripts/asks-a-question.sh
  timeout_seconds: 30
